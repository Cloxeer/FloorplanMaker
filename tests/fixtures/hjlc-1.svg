<svg xmlns="http://www.w3.org/2000/svg" viewBox="230 -190 1080 1820" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Hardman & Jacobs Undergraduate Learning Center (bldg 323) - FLOOR 1
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .big   { fill: #e6ecf5; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
  </style>

  <!-- OUTSIDE WALLS: the real stepped footprint of floor 1 -->
  <polygon class="floor" points="258,5 1128,5 1128,490 1285,490 1285,905 1270,905 1270,1250 1250,1250 1250,1420 1178,1420 1178,1590 545,1590 545,1250 685,1250 685,995 388,995 388,545 258,545"/>

  <!-- TOP ROW: 128 suite offices -->
  <rect class="room" x="258" y="10" width="100" height="90"/><text class="lblS" x="308" y="55">128B</text>
  <rect class="room" x="358" y="10" width="67" height="90"/><text class="lblS" x="391" y="55">128C</text>
  <rect class="room" x="425" y="10" width="65" height="90"/><text class="lblS" x="457" y="55">128D</text>
  <rect class="room" x="490" y="10" width="65" height="90"/><text class="lblS" x="522" y="55">128E</text>
  <rect class="room" x="555" y="10" width="65" height="90"/><text class="lblS" x="587" y="55">128F</text>
  <rect class="room" x="620" y="10" width="65" height="90"/><text class="lblS" x="652" y="55">128G</text>
  <rect class="room" x="685" y="10" width="65" height="90"/><text class="lblS" x="717" y="55">128H</text>
  <rect class="room" x="750" y="10" width="65" height="90"/><text class="lblS" x="782" y="55">128J</text>
  <rect class="room" x="815" y="10" width="63" height="90"/><text class="lblS" x="846" y="55">128K</text>
  <rect class="room" x="878" y="10" width="67" height="90"/><text class="lblS" x="911" y="55">128L</text>
  <rect class="room" x="945" y="10" width="95" height="155"/><text class="lbl" x="992" y="80">R134</text>
  <rect class="room" x="1040" y="10" width="85" height="175"/><text class="lbl" x="1082" y="90">R133</text>

  <!-- STUDENT SUCCESS / UPWARD BOUND suite -->
  <rect class="room" x="258" y="105" width="167" height="125"/><text class="lbl" x="341" y="168">128</text>
  <rect class="room" x="268" y="232" width="97" height="83"/><text class="lbl" x="316" y="274">128A</text>
  <rect class="ours" x="425" y="105" width="450" height="280"/>
  <text class="name" x="650" y="160">Student Success /</text>
  <text class="name" x="650" y="196">Upward Bound</text>
  <text class="lbl" x="560" y="240">128R</text>
  <rect class="room" x="672" y="278" width="76" height="107"/><text class="lblS" x="710" y="332">128Q</text>
  <rect class="room" x="878" y="140" width="62" height="82"/><text class="lblS" x="909" y="182">128N</text>
  <rect class="room" x="878" y="225" width="62" height="78"/><text class="lblS" x="909" y="265">128O</text>
  <rect class="room" x="878" y="305" width="62" height="80"/><text class="lblS" x="909" y="345">128P</text>
  <rect class="core" x="945" y="185" width="105" height="200"/><text class="lbl" x="997" y="285">M132</text>
  <rect class="room" x="1053" y="205" width="67" height="82"/><text class="lbl" x="1086" y="248">R131</text>
  <rect class="room" x="1053" y="290" width="67" height="95"/><text class="lbl" x="1086" y="338">J129</text>

  <!-- NW stair ST1 -->
  <rect class="core" x="275" y="320" width="105" height="205"/>
  <g class="stair"><line x1="285" y1="345" x2="370" y2="345"/><line x1="285" y1="370" x2="370" y2="370"/><line x1="285" y1="395" x2="370" y2="395"/><line x1="285" y1="420" x2="370" y2="420"/></g>
  <text class="lbl" x="327" y="478">ST1</text>

  <!-- CENTRE: lecture hall + support rooms -->
  <polygon class="room" points="445,505 548,505 510,680 445,680"/><text class="lbl" x="488" y="565">M127</text>
  <rect class="core" x="455" y="745" width="60" height="110"/><text class="lblS" x="485" y="800">M123</text>
  <rect class="room" x="455" y="860" width="60" height="45"/><text class="lblS" x="485" y="883">S122</text>
  <rect class="room" x="518" y="860" width="40" height="45"/><text class="lblS" x="538" y="883">S125</text>
  <polygon class="big" points="550,505 930,505 975,550 975,855 930,900 595,900 550,855"/>
  <text class="name" x="762" y="690">Lecture Hall</text><text class="lbl" x="762" y="726">125</text>
  <rect class="big" x="1045" y="495" width="240" height="410"/>
  <text class="name" x="1165" y="690">Classroom</text><text class="lbl" x="1165" y="726">126</text>

  <!-- EAST CORE: stair, elevator, 101A, M118 -->
  <rect class="core" x="975" y="975" width="65" height="65"/>
  <g class="stair"><line x1="983" y1="990" x2="1032" y2="990"/><line x1="983" y1="1008" x2="1032" y2="1008"/><line x1="983" y1="1026" x2="1032" y2="1026"/></g>
  <rect class="core" x="1045" y="985" width="60" height="60"/><text class="lblS" x="1075" y="1015">Elev</text>
  <rect class="room" x="1085" y="910" width="35" height="60"/><text class="lblS" x="1102" y="940" font-size="15">M118</text>
  <rect class="room" x="1035" y="1065" width="65" height="105"/><text class="lbl" x="1067" y="1117">101A</text>

  <!-- COMPUTER LAB -->
  <rect class="big" x="685" y="995" width="295" height="255"/>
  <text class="name" x="832" y="1105">Computer Lab</text><text class="lbl" x="832" y="1140">101</text>

  <!-- SOUTH ROW (ICT) -->
  <rect class="room" x="545" y="1255" width="87" height="180"/><text class="lbl" x="588" y="1330">121</text>
  <rect class="room" x="632" y="1255" width="120" height="165"/><text class="lbl" x="692" y="1330">119</text>
  <rect class="room" x="755" y="1260" width="65" height="165"/><text class="lblS" x="787" y="1340">S117</text>
  <rect class="room" x="822" y="1260" width="83" height="165"/><text class="lblS" x="863" y="1340">S115</text>
  <rect class="room" x="907" y="1260" width="63" height="57"/><text class="lblS" x="938" y="1288">102</text>
  <rect class="room" x="907" y="1320" width="63" height="70"/><text class="lblS" x="938" y="1355">104</text>
  <rect class="room" x="907" y="1392" width="63" height="33"/><text class="lblS" x="938" y="1409" font-size="15">T106</text>
  <text class="lbl" x="648" y="1458">ICT</text>
  <rect class="room" x="548" y="1480" width="64" height="105"/><text class="lbl" x="580" y="1532">120</text>
  <rect class="room" x="612" y="1480" width="140" height="105"/><text class="lbl" x="682" y="1532">118</text>
  <rect class="room" x="755" y="1475" width="73" height="110"/><text class="lblS" x="791" y="1530">S116</text>
  <rect class="room" x="828" y="1475" width="50" height="110"/><text class="lblS" x="853" y="1530" font-size="15">T114</text>
  <rect class="core" x="910" y="1480" width="60" height="75"/>
  <g class="stair"><line x1="918" y1="1498" x2="962" y2="1498"/><line x1="918" y1="1516" x2="962" y2="1516"/><line x1="918" y1="1534" x2="962" y2="1534"/></g>
  <rect class="room" x="1030" y="1255" width="80" height="100"/><text class="lbl" x="1070" y="1305">103</text>
  <rect class="room" x="1112" y="1255" width="63" height="60"/><text class="lblS" x="1143" y="1285">105A</text>
  <rect class="big" x="1030" y="1360" width="220" height="58"/><text class="lbl" x="1140" y="1389">Help Desk 105</text>
  <rect class="room" x="1130" y="1420" width="42" height="45"/><text class="lblS" x="1151" y="1442" font-size="15">J107</text>
  <rect class="room" x="1033" y="1470" width="65" height="110"/><text class="lblS" x="1065" y="1525">R108</text>
  <rect class="room" x="1100" y="1470" width="75" height="110"/><text class="lblS" x="1137" y="1525">R106</text>

  <!-- EXTERIOR DOORS: gaps in the outside wall where the posted plan shows exits -->
  <line class="door" x1="388" y1="572" x2="388" y2="608"/><text class="exit" x="335" y="590">EXIT</text>
  <line class="door" x1="388" y1="800" x2="388" y2="836"/><text class="exit" x="335" y="818">EXIT</text>
  <line class="door" x1="1270" y1="1188" x2="1270" y2="1224"/><text class="exit" x="1215" y="1170">EXIT</text>
  <line class="door" x1="975" y1="1590" x2="1015" y2="1590"/><text class="exit" x="995" y="1614">EXIT</text>
  <line class="door" x1="1270" y1="925" x2="1270" y2="962"/><text class="exit" x="1190" y="944" fill="#5f6368">Door</text>

  <!-- Which way the building really faces. The angle comes from NMSU Space Planning's outline of the
       building, and matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(1215,-95) rotate(12)">
    <circle r="62" fill="#ffffff" stroke="#e6e6ea" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
