<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1940 1051" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Hadley Hall (bldg 172) - FLOOR 2
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="160,120 1790,120 1790,470 1810,470 1810,830 1385,830 1385,670 1360,670 1360,825 835,825 835,945 710,945 710,810 585,810 585,820 495,820 495,790 395,790 395,820 415,820 415,950 310,950 310,820 155,820 155,575 0,575 0,520 160,520 160,460 0,460 0,415 160,415 160,355 0,355 0,315 160,315"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="775" y="120" width="335" height="130"/>
  <text class="hall-lbl" x="943" y="183">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="1360,120 1360,210 1310,210 1310,415 1170,415 1110,355 1110,120"/><text class="lbl" x="1221" y="256">215</text>
  <polygon class="room" points="55,460 0,460 0,415 55,415"/>
  <polygon class="room" points="655,670 655,740 495,740 495,670"/><text class="lbl" x="575" y="705">201A</text>
  <polygon class="room" points="310,830 415,830 415,900 395,945 310,945"/>
  <polygon class="room" points="775,905 755,900 745,905"/>
  <polygon class="room" points="0,520 55,520 55,575 0,575"/>
  <rect class="room" x="160" y="120" width="335" height="400"/><text class="lbl" x="328" y="320">222</text>
  <rect class="room" x="495" y="120" width="280" height="235"/><text class="lbl" x="635" y="238">221</text>
  <rect class="room" x="1360" y="120" width="135" height="90"/><text class="lbl" x="1428" y="165">214B</text>
  <rect class="room" x="1505" y="120" width="285" height="705"/><text class="lbl" x="1648" y="473">214</text>
  <rect class="room" x="1360" y="210" width="135" height="105"/><text class="lbl" x="1428" y="263">214A</text>
  <rect class="room" x="585" y="250" width="385" height="325"/><text class="lbl" x="778" y="413">216</text>
  <rect class="room" x="0" y="315" width="55" height="40"/>
  <rect class="room" x="1360" y="315" width="145" height="100"/><text class="lbl" x="1433" y="365">213</text>
  <rect class="room" x="1170" y="415" width="215" height="160"/><text class="lbl" x="1278" y="495">210</text>
  <rect class="room" x="155" y="520" width="240" height="300"/><text class="lbl" x="275" y="670">223</text>
  <rect class="room" x="395" y="670" width="100" height="120"/><text class="lbl" x="445" y="730">201D</text>
  <rect class="room" x="1385" y="670" width="110" height="155"/><text class="lbl" x="1440" y="748">210A</text>
  <rect class="room" x="675" y="710" width="160" height="80"/><text class="lbl" x="755" y="750">201</text>
  <rect class="room" x="495" y="740" width="90" height="80"/><text class="lbl" x="540" y="780">201C</text>
  <rect class="room" x="585" y="740" width="70" height="50"/><text class="lblS" x="620" y="765">201B</text>
  <rect class="room" x="585" y="790" width="70" height="20"/>

  <rect class="core" x="1020" y="790" width="225" height="35"/>
  <g class="stair"><line x1="1029" y1="790" x2="1029" y2="825"/><line x1="1047" y1="790" x2="1047" y2="825"/><line x1="1065" y1="790" x2="1065" y2="825"/><line x1="1083" y1="790" x2="1083" y2="825"/><line x1="1101" y1="790" x2="1101" y2="825"/><line x1="1119" y1="790" x2="1119" y2="825"/><line x1="1137" y1="790" x2="1137" y2="825"/><line x1="1155" y1="790" x2="1155" y2="825"/><line x1="1173" y1="790" x2="1173" y2="825"/><line x1="1191" y1="790" x2="1191" y2="825"/><line x1="1209" y1="790" x2="1209" y2="825"/><line x1="1227" y1="790" x2="1227" y2="825"/></g>
  <polygon class="floor-edge" points="160,120 1790,120 1790,470 1810,470 1810,830 1385,830 1385,670 1360,670 1360,825 835,825 835,945 710,945 710,810 585,810 585,820 495,820 495,790 395,790 395,820 415,820 415,950 310,950 310,820 155,820 155,575 0,575 0,520 160,520 160,460 0,460 0,415 160,415 160,355 0,355 0,315 160,315"/>
  <line class="door" x1="1134" y1="825" x2="1098" y2="825"/><text class="exit" x="1116" y="770">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(323,1007) rotate(193)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
