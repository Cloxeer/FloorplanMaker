<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1845 713" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Chemistry Building (bldg 187) - FLOOR 1
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="1750,55 1845,55 1845,270 1795,270 1795,620 1720,620 1720,270 1710,270 1710,580 1705,580 1705,645 330,645 330,590 0,590 0,395 135,395 135,65 935,65 935,60 1705,60 1705,160 1750,160"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="330" y="395" width="425" height="95"/>
  <rect class="hall" x="735" y="65" width="50" height="330"/>
  <rect class="hall" x="755" y="395" width="375" height="95"/>
  <rect class="hall" x="1130" y="395" width="305" height="95"/>
  <text class="hall-lbl" x="883" y="443">Hallway</text>
  <text class="hall-lbl" x="548" y="443">Hallway</text>
  <text class="hall-lbl" x="1218" y="443">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="0,395 50,395 50,540 0,540"/>
  <polygon class="room" points="1665,490 1710,490 1710,580 1665,580 1665,540 1600,540 1600,580 1535,580 1535,540 1630,540"/>
  <polygon class="room" points="935,490 1025,490 1025,645 935,645"/><text class="lbl" x="980" y="568">R142</text>
  <polygon class="room" points="1025,490 1150,490 1150,645 1025,645"/><text class="lbl" x="1088" y="568">143</text>
  <polygon class="room" points="830,490 830,645 735,645 735,490"/><text class="lbl" x="783" y="568">141</text>
  <polygon class="room" points="1090,65 1130,100 1130,395 850,395 850,270 785,215 785,100 830,100 830,65"/><text class="lbl" x="973" y="225">130</text>
  <polygon class="room" points="1130,65 1130,395 1045,395 1045,360 935,360 935,270 970,160 935,160 935,65"/>
  <rect class="room" x="135" y="65" width="195" height="330"/><text class="lbl" x="233" y="230">134</text>
  <rect class="room" x="330" y="65" width="210" height="330"/><text class="lbl" x="435" y="230">133</text>
  <rect class="room" x="540" y="65" width="195" height="330"/><text class="lbl" x="638" y="230">132</text>
  <rect class="room" x="1130" y="65" width="155" height="205"/><text class="lbl" x="1208" y="168">128</text>
  <rect class="room" x="1285" y="65" width="250" height="205"/><text class="lbl" x="1410" y="168">127</text>
  <rect class="room" x="1130" y="270" width="105" height="125"/><text class="lbl" x="1183" y="333">129</text>
  <rect class="room" x="1235" y="270" width="200" height="125"/><text class="lbl" x="1335" y="333">125</text>
  <rect class="room" x="1435" y="270" width="100" height="125"/><text class="lbl" x="1485" y="333">126</text>
  <rect class="room" x="330" y="490" width="105" height="155"/><text class="lbl" x="383" y="568">137</text>
  <rect class="room" x="435" y="490" width="200" height="155"/><text class="lbl" x="535" y="568">138</text>
  <rect class="room" x="635" y="490" width="100" height="155"/><text class="lbl" x="685" y="568">140</text>
  <rect class="room" x="830" y="490" width="105" height="155"/>
  <rect class="room" x="1150" y="490" width="85" height="155"/><text class="lbl" x="1193" y="568">144</text>
  <rect class="room" x="1720" y="490" width="75" height="130"/>
  <rect class="room" x="0" y="540" width="50" height="50"/>

  <polygon class="floor-edge" points="1750,55 1845,55 1845,270 1795,270 1795,620 1720,620 1720,270 1710,270 1710,580 1705,580 1705,645 330,645 330,590 0,590 0,395 135,395 135,65 935,65 935,60 1705,60 1705,160 1750,160"/>
  <line class="door" x1="1612" y1="60" x2="1648" y2="60"/><text class="exit" x="1630" y="115">EXIT</text>
</svg>
