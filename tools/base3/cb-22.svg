<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1591 936" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Chemistry Building (bldg 187) - FLOOR 2
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="0,15 1525,15 1525,645 910,645 910,870 765,870 765,865 760,865 760,640 675,640 675,865 540,865 540,860 535,860 535,645 225,645 225,610 110,610 110,255 80,255 80,695 0,695"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="0" y="60" width="80" height="195"/>
  <rect class="hall" x="110" y="60" width="355" height="90"/>
  <rect class="hall" x="465" y="60" width="295" height="90"/>
  <rect class="hall" x="760" y="60" width="490" height="90"/>
  <rect class="hall" x="1250" y="60" width="275" height="90"/>
  <rect class="hall" x="675" y="430" width="315" height="85"/>
  <rect class="hall" x="0" y="15" width="1525" height="45"/>
  <rect class="hall" x="1475" y="150" width="50" height="280"/>
  <rect class="hall" x="0" y="255" width="80" height="355"/>
  <rect class="hall" x="1200" y="490" width="275" height="65"/>
  <rect class="hall" x="1313" y="490" width="55" height="10"/>
  <rect class="hall" x="300" y="430" width="285" height="85"/>
  <rect class="hall" x="585" y="430" width="90" height="60"/>
  <rect class="hall" x="990" y="430" width="105" height="85"/>
  <rect class="hall" x="1095" y="430" width="380" height="60"/>
  <rect class="hall" x="585" y="490" width="90" height="155"/>
  <text class="hall-lbl" x="818" y="83">Hallway</text>
  <text class="hall-lbl" x="408" y="83">Hallway</text>
  <text class="hall-lbl" x="1228" y="83">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="375,150 375,360 500,360 500,430 175,430 175,380 225,380 225,220 110,220 110,150"/><text class="lbl" x="298" y="296">231</text>
  <polygon class="room" points="110,220 225,220 225,380 175,380 175,430 110,430"/><text class="lbl" x="164" y="316">231A</text>
  <polygon class="room" points="80,610 80,695 0,695 0,610"/>
  <polygon class="room" points="675,805 675,860 540,860 540,805"/><text class="lblS" x="608" y="833">W289</text>
  <rect class="room" x="375" y="150" width="125" height="210"/>
  <rect class="room" x="500" y="150" width="175" height="280"/><text class="lbl" x="588" y="290">229</text>
  <rect class="room" x="675" y="150" width="235" height="280"/><text class="lbl" x="793" y="290">228</text>
  <rect class="room" x="910" y="150" width="185" height="280"/><text class="lbl" x="1003" y="290">227</text>
  <rect class="room" x="1095" y="150" width="380" height="280"/><text class="lbl" x="1285" y="290">225</text>
  <rect class="room" x="300" y="515" width="100" height="130"/><text class="lbl" x="350" y="580">234</text>
  <rect class="room" x="400" y="515" width="100" height="125"/><text class="lbl" x="450" y="578">235</text>
  <rect class="room" x="500" y="515" width="85" height="125"/><text class="lbl" x="543" y="578">236</text>
  <rect class="room" x="675" y="515" width="90" height="125"/><text class="lbl" x="720" y="578">238</text>
  <rect class="room" x="765" y="515" width="145" height="125"/>
  <rect class="room" x="910" y="515" width="80" height="125"/><text class="lbl" x="950" y="578">R239</text>
  <rect class="room" x="990" y="515" width="105" height="125"/><text class="lbl" x="1043" y="578">240</text>
  <rect class="room" x="1095" y="515" width="105" height="125"/><text class="lbl" x="1148" y="578">241</text>
  <rect class="room" x="760" y="640" width="150" height="120"/><text class="lbl" x="835" y="700">W292</text>
  <rect class="room" x="540" y="645" width="135" height="160"/><text class="lbl" x="608" y="725">W290</text>
  <rect class="room" x="760" y="760" width="150" height="105"/><text class="lbl" x="835" y="813">W293</text>

  <rect class="core" x="225" y="555" width="30" height="85"/>
  <g class="stair"><line x1="234" y1="555" x2="234" y2="640"/><line x1="252" y1="555" x2="252" y2="640"/></g>
  <rect class="core" x="1395" y="555" width="45" height="85"/>
  <g class="stair"><line x1="1404" y1="555" x2="1404" y2="640"/><line x1="1422" y1="555" x2="1422" y2="640"/></g>
  <polygon class="floor-edge" points="0,15 1525,15 1525,645 910,645 910,870 765,870 765,865 760,865 760,640 675,640 675,865 540,865 540,860 535,860 535,645 225,645 225,610 110,610 110,255 80,255 80,695 0,695"/>
  <line class="door" x1="0" y1="225" x2="0" y2="189"/><text class="exit" x="55" y="207">EXIT</text>
  <line class="door" x1="110" y1="566" x2="110" y2="530"/><text class="exit" x="165" y="548">EXIT</text>
  <line class="door" x1="1356" y1="645" x2="1320" y2="645"/><text class="exit" x="1338" y="590">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(261,803) rotate(284)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
