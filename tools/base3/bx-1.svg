<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1282 1080" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Biology Annex (bldg 82) - FLOOR 1
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="1250,30 1280,30 1280,70 1270,70 1270,80 1285,80 1285,160 830,160 830,935 210,935 210,120 1250,120"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="430" y="450" width="300" height="70"/>
  <rect class="hall" x="670" y="520" width="160" height="70"/>
  <rect class="hall" x="670" y="590" width="60" height="125"/>
  <rect class="hall" x="800" y="520" width="30" height="220"/>
  <rect class="hall" x="730" y="670" width="100" height="70"/>
  <rect class="hall" x="635" y="715" width="95" height="25"/>
  <rect class="hall" x="635" y="740" width="95" height="40"/>
  <text class="hall-lbl" x="578" y="483">Hallway</text>
  <text class="hall-lbl" x="748" y="703">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="605,520 605,550 595,550 595,520"/>
  <polygon class="room" points="490,520 595,520 595,715 490,715"/><text class="lbl" x="543" y="618">103</text>
  <polygon class="room" points="340,715 635,715 635,780 450,780 450,935 340,935"/>
  <polygon class="room" points="650,780 650,935 450,935 450,780"/><text class="lbl" x="550" y="858">101</text>
  <polygon class="room" points="730,895 760,895 760,935 730,935"/>
  <polygon class="room" points="725,640 800,640 800,670 725,670"/>
  <rect class="room" x="210" y="520" width="280" height="195"/><text class="lbl" x="350" y="618">113</text>
  <rect class="room" x="595" y="570" width="75" height="145"/><text class="lbl" x="633" y="643">112</text>
  <rect class="room" x="730" y="590" width="70" height="50"/><text class="lblS" x="765" y="615">110D</text>
  <rect class="room" x="210" y="715" width="130" height="105"/><text class="lbl" x="275" y="768">103C</text>
  <rect class="room" x="730" y="740" width="100" height="140"/>
  <rect class="room" x="210" y="820" width="130" height="115"/><text class="lbl" x="275" y="878">103B</text>

  <rect class="core" x="1250" y="30" width="30" height="40"/>
  <g class="stair"><line x1="1259" y1="30" x2="1259" y2="70"/><line x1="1277" y1="30" x2="1277" y2="70"/></g>
  <rect class="core" x="1250" y="120" width="35" height="40"/>
  <g class="stair"><line x1="1250" y1="129" x2="1285" y2="129"/><line x1="1250" y1="147" x2="1285" y2="147"/></g>
  <polygon class="floor-edge" points="1250,30 1280,30 1280,70 1270,70 1270,80 1285,80 1285,160 830,160 830,935 210,935 210,120 1250,120"/>
  <line class="door" x1="709" y1="935" x2="673" y2="935"/><text class="exit" x="691" y="880">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(96,954) rotate(192)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
