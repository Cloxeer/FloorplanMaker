  <rect class="room" x="450" y="565" width="115" height="105"/><text class="lbl" x="508" y="618">W194</text>

  <rect class="core" x="145" y="175" width="65" height="115"/>
  <g class="stair"><line x1="145" y1="184" x2="210" y2="184"/><line x1="145" y1="202" x2="210" y2="202"/><line x1="145" y1="220" x2="210" y2="220"/><line x1="145" y1="238" x2="210" y2="238"/><line x1="145" y1="256" x2="210" y2="256"/><line x1="145" y1="274" x2="210" y2="274"/></g>
  <rect class="core" x="1460" y="240" width="45" height="50"/>
  <g class="stair"><line x1="1469" y1="240" x2="1469" y2="290"/><line x1="1487" y1="240" x2="1487" y2="290"/></g>
  <rect class="core" x="1340" y="545" width="40" height="115"/>
  <g class="stair"><line x1="1340" y1="554" x2="1380" y2="554"/><line x1="1340" y1="572" x2="1380" y2="572"/><line x1="1340" y1="590" x2="1380" y2="590"/><line x1="1340" y1="608" x2="1380" y2="608"/><line x1="1340" y1="626" x2="1380" y2="626"/><line x1="1340" y1="644" x2="1380" y2="644"/></g>
  <polygon class="floor-edge" points="1650,55 1745,55 1745,805 225,805 225,670 220,670 220,630 150,630 150,515 145,515 145,465 150,465 150,460 215,460 215,350 150,350 150,290 145,290 145,175 210,175 210,190 335,190 335,65 1355,65 1355,120 1460,120 1460,70 1650,70"/>
