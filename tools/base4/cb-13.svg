  <rect class="room" x="335" y="65" width="455" height="320"/><text class="lbl" x="563" y="225">W191</text>
  <rect class="room" x="790" y="175" width="105" height="115"/><text class="lbl" x="843" y="233">W187</text>
  <rect class="room" x="980" y="190" width="200" height="100"/><text class="lbl" x="1080" y="240">W185</text>
