<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1940 1051" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Hadley Hall (bldg 172) - FLOOR 2
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="1625,80 1805,80 1805,830 1630,830 1630,845 850,845 850,975 660,975 660,850 415,850 415,950 310,950 310,935 130,935 130,100 1625,100"/>

  <!-- ROOMS -->
  <polygon class="room" points="1365,100 1365,210 1310,210 1310,410 1170,410 1110,350 1110,100"/><text class="lbl" x="1224" y="242">215</text>
  <polygon class="room" points="660,680 660,745 495,745 495,680"/><text class="lblS" x="578" y="713">201A</text>
  <polygon class="room" points="660,745 660,785 595,785 595,745"/><text class="lblS" x="628" y="765">201B</text>
  <polygon class="room" points="310,850 415,850 415,950 370,950 370,935 310,935"/>
  <polygon class="room" points="710,850 785,850 785,935 710,935"/>
  <rect class="room" x="130" y="100" width="365" height="430"/><text class="lbl" x="313" y="315">222</text>
  <rect class="room" x="495" y="100" width="275" height="250"/><text class="lbl" x="633" y="225">221</text>
  <rect class="room" x="1365" y="100" width="130" height="110"/><text class="lbl" x="1430" y="155">214B</text>
  <rect class="room" x="1495" y="100" width="310" height="730"/><text class="lbl" x="1650" y="465">214</text>
  <rect class="room" x="1340" y="210" width="155" height="105"/><text class="lbl" x="1418" y="263">214A</text>
  <rect class="room" x="595" y="250" width="375" height="345"/><text class="lbl" x="783" y="423">216</text>
  <rect class="room" x="1340" y="315" width="155" height="95"/><text class="lbl" x="1418" y="363">213</text>
  <rect class="room" x="1170" y="410" width="235" height="140"/><text class="lbl" x="1288" y="480">210</text>
  <rect class="room" x="130" y="530" width="285" height="300"/><text class="lbl" x="273" y="680">223</text>
  <rect class="room" x="415" y="680" width="80" height="105"/><text class="lbl" x="455" y="733">201D</text>
  <rect class="room" x="1385" y="680" width="110" height="150"/><text class="lbl" x="1440" y="755">210A</text>
  <rect class="room" x="660" y="710" width="150" height="75"/><text class="lbl" x="735" y="748">201</text>
  <rect class="room" x="495" y="745" width="100" height="85"/><text class="lbl" x="545" y="788">201C</text>
  <rect class="room" x="595" y="785" width="65" height="45"/>

  <rect class="core" x="1020" y="785" width="225" height="45"/>
  <g class="stair"><line x1="1029" y1="785" x2="1029" y2="830"/><line x1="1047" y1="785" x2="1047" y2="830"/><line x1="1065" y1="785" x2="1065" y2="830"/><line x1="1083" y1="785" x2="1083" y2="830"/><line x1="1101" y1="785" x2="1101" y2="830"/><line x1="1119" y1="785" x2="1119" y2="830"/><line x1="1137" y1="785" x2="1137" y2="830"/><line x1="1155" y1="785" x2="1155" y2="830"/><line x1="1173" y1="785" x2="1173" y2="830"/><line x1="1191" y1="785" x2="1191" y2="830"/><line x1="1209" y1="785" x2="1209" y2="830"/><line x1="1227" y1="785" x2="1227" y2="830"/></g>
  <polygon class="floor-edge" points="1625,80 1805,80 1805,830 1630,830 1630,845 850,845 850,975 660,975 660,850 415,850 415,950 310,950 310,935 130,935 130,100 1625,100"/>
  <line class="door" x1="1134" y1="845" x2="1098" y2="845"/><text class="exit" x="1116" y="790">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(323,1007) rotate(193)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
