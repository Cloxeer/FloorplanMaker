<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1157 809" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Chemistry Building (bldg 187) - FLOOR 1
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="470,35 1060,35 1060,285 1050,285 1050,300 900,300 900,315 865,315 865,335 850,335 850,420 765,420 765,460 645,460 645,445 430,445 430,465 310,465 310,565 435,565 435,730 425,730 425,765 320,765 320,715 70,715 70,470 160,470 160,415 350,415 350,290 435,290 435,235 540,235 540,285 535,285 535,290 645,290 645,95 470,95"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="350" y="315" width="500" height="100"/>
  <rect class="hall" x="645" y="415" width="120" height="45"/>
  <rect class="hall" x="160" y="420" width="270" height="40"/>
  <rect class="hall" x="350" y="415" width="75" height="5"/>
  <rect class="hall" x="678" y="395" width="55" height="10"/>
  <text class="hall-lbl" x="648" y="363">Hallway</text>
  <text class="hall-lbl" x="443" y="388">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="470,35 540,35 540,95 470,95"/><text class="lblS" x="505" y="65">W157</text>
  <polygon class="room" points="435,235 540,235 540,285 435,285"/><text class="lblS" x="488" y="260">W159</text>
  <polygon class="room" points="320,565 430,565 430,605 320,605"/><text class="lblS" x="375" y="585">M161</text>
  <polygon class="room" points="70,470 120,470 120,510 160,510 160,715 70,715"/><text class="lbl" x="113" y="601">R161A</text>
  <polygon class="room" points="250,470 310,470 310,715 210,715 210,510 250,510"/><text class="lbl" x="262" y="600">R161B</text>
  <polygon class="room" points="320,605 350,605 350,620 425,620 425,730 350,730 350,765 320,765"/><text class="lbl" x="368" y="679">W115</text>
  <rect class="room" x="645" y="35" width="405" height="255"/><text class="lbl" x="848" y="163">W156</text>

  <polygon class="floor-edge" points="470,35 1060,35 1060,285 1050,285 1050,300 900,300 900,315 865,315 865,335 850,335 850,420 765,420 765,460 645,460 645,445 430,445 430,465 310,465 310,565 435,565 435,730 425,730 425,765 320,765 320,715 70,715 70,470 160,470 160,415 350,415 350,290 435,290 435,235 540,235 540,285 535,285 535,290 645,290 645,95 470,95"/>
  <line class="door" x1="506" y1="95" x2="470" y2="95"/><text class="exit" x="488" y="40">EXIT</text>
  <line class="door" x1="435" y1="271" x2="435" y2="235"/><text class="exit" x="490" y="253">EXIT</text>
  <line class="door" x1="399" y1="290" x2="435" y2="290"/><text class="exit" x="417" y="345">EXIT</text>
  <line class="door" x1="995" y1="300" x2="959" y2="300"/><text class="exit" x="977" y="245">EXIT</text>
  <line class="door" x1="900" y1="315" x2="865" y2="315"/><text class="exit" x="883" y="260">EXIT</text>
  <line class="door" x1="170" y1="415" x2="206" y2="415"/><text class="exit" x="188" y="470">EXIT</text>
  <line class="door" x1="88" y1="470" x2="124" y2="470"/><text class="exit" x="106" y="525">EXIT</text>
  <line class="door" x1="422" y1="765" x2="386" y2="765"/><text class="exit" x="404" y="710">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(147,134) rotate(282)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
