<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1355 1181" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Chemistry Building (bldg 187) - FLOOR 3
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="220,35 255,35 255,70 1340,70 1340,535 1335,535 1335,1140 1330,1140 1330,1175 245,1175 245,735 145,735 145,650 80,650 80,640 15,640 15,70 220,70"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="1330" y="300" width="10" height="235"/>
  <rect class="hall" x="385" y="535" width="755" height="105"/>
  <rect class="hall" x="920" y="710" width="90" height="25"/>
  <rect class="hall" x="525" y="735" width="60" height="255"/>
  <rect class="hall" x="370" y="945" width="155" height="45"/>
  <rect class="hall" x="585" y="945" width="135" height="45"/>
  <rect class="hall" x="650" y="300" width="70" height="235"/>
  <rect class="hall" x="535" y="490" width="115" height="45"/>
  <rect class="hall" x="430" y="640" width="95" height="95"/>
  <rect class="hall" x="915" y="640" width="160" height="10"/>
  <rect class="hall" x="915" y="650" width="105" height="55"/>
  <rect class="hall" x="955" y="705" width="25" height="30"/>
  <text class="hall-lbl" x="763" y="573">Hallway</text>
  <text class="hall-lbl" x="1008" y="588">Hallway</text>
  <text class="hall-lbl" x="518" y="573">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="145,610 245,610 245,735 145,735"/>
  <polygon class="room" points="1330,1175 1260,1175 1260,1140 1330,1140"/>
  <polygon class="room" points="1330,1085 1335,1085 1330,1070"/>
  <polygon class="room" points="1335,1070 1330,1070 1330,1085 1335,1085"/>
  <rect class="room" x="965" y="190" width="110" height="65"/>
  <rect class="room" x="340" y="255" width="185" height="280"/>
  <rect class="room" x="720" y="255" width="195" height="280"/>
  <rect class="room" x="915" y="255" width="415" height="280"/>
  <rect class="room" x="535" y="315" width="115" height="175"/>
  <rect class="room" x="15" y="610" width="65" height="30"/>
  <rect class="room" x="80" y="610" width="65" height="40"/>
  <rect class="room" x="525" y="610" width="85" height="125"/>
  <rect class="room" x="1325" y="615" width="5" height="50"/>
  <rect class="room" x="245" y="640" width="95" height="95"/>
  <rect class="room" x="340" y="640" width="90" height="95"/>
  <rect class="room" x="610" y="640" width="110" height="95"/>
  <rect class="room" x="1020" y="650" width="55" height="85"/>
  <rect class="room" x="1330" y="710" width="5" height="25"/>
  <rect class="room" x="385" y="735" width="140" height="210"/>
  <rect class="room" x="585" y="735" width="135" height="110"/>
  <rect class="room" x="1330" y="825" width="5" height="60"/>
  <rect class="room" x="585" y="845" width="135" height="100"/>
  <rect class="room" x="1260" y="990" width="70" height="80"/>
  <rect class="room" x="1330" y="1085" width="5" height="55"/>

  <rect class="core" x="220" y="35" width="35" height="35"/>
  <g class="stair"><line x1="220" y1="44" x2="255" y2="44"/><line x1="220" y1="62" x2="255" y2="62"/></g>
  <polygon class="floor-edge" points="220,35 255,35 255,70 1340,70 1340,535 1335,535 1335,1140 1330,1140 1330,1175 245,1175 245,735 145,735 145,650 80,650 80,640 15,640 15,70 220,70"/>
  <line class="door" x1="59" y1="640" x2="23" y2="640"/><text class="exit" x="41" y="585">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(109,858) rotate(283)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
