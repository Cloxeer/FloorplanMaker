<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 1088" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Biology Annex (bldg 82) - FLOOR 1
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="1220,95 1230,95 1230,100 1240,100 1240,110 1300,110 1300,160 835,160 835,930 215,930 215,140 1210,140 1210,100 1220,100"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="450" y="460" width="385" height="60"/>
  <rect class="hall" x="670" y="520" width="50" height="190"/>
  <rect class="hall" x="720" y="160" width="115" height="45"/>
  <rect class="hall" x="750" y="205" width="40" height="255"/>
  <text class="hall-lbl" x="643" y="488">Hallway</text>
  <text class="hall-lbl" transform="rotate(-90 773 338)" x="773" y="338">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="250,520 450,520 450,555 500,555 500,710 215,710 215,555 250,555"/><text class="lbl" x="356" y="620">113</text>
  <polygon class="room" points="500,645 595,645 595,710 500,710"/><text class="lblS" x="548" y="678">103A</text>
  <polygon class="room" points="340,710 640,710 640,785 450,785 450,930 340,930"/><text class="lbl" x="451" y="793">103</text>
  <polygon class="room" points="835,710 790,710 790,675 750,675 750,710 720,710 720,645 835,645"/><text class="lblS" x="779" y="674">R100B</text>
  <rect class="room" x="670" y="160" width="50" height="45"/><text class="lblS" x="695" y="183">111A</text>
  <rect class="room" x="500" y="520" width="95" height="125"/><text class="lbl" x="548" y="583">103F</text>
  <rect class="room" x="595" y="580" width="75" height="130"/><text class="lbl" x="633" y="645">112</text>
  <rect class="room" x="720" y="600" width="115" height="45"/><text class="lblS" x="778" y="623">100</text>
  <rect class="room" x="215" y="710" width="125" height="115"/><text class="lbl" x="278" y="768">103C</text>
  <rect class="room" x="215" y="825" width="125" height="105"/><text class="lbl" x="278" y="878">103B</text>

  <rect class="core" x="1210" y="100" width="30" height="40"/>
  <g class="stair"><line x1="1219" y1="100" x2="1219" y2="140"/><line x1="1237" y1="100" x2="1237" y2="140"/></g>
  <rect class="core" x="1240" y="110" width="60" height="50"/>
  <g class="stair"><line x1="1240" y1="119" x2="1300" y2="119"/><line x1="1240" y1="137" x2="1300" y2="137"/><line x1="1240" y1="155" x2="1300" y2="155"/></g>
  <polygon class="floor-edge" points="1220,95 1230,95 1230,100 1240,100 1240,110 1300,110 1300,160 835,160 835,930 215,930 215,140 1210,140 1210,100 1220,100"/>
  <line class="door" x1="711" y1="930" x2="675" y2="930"/><text class="exit" x="693" y="875">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(96,960) rotate(192)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
