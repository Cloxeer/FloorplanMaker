<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 476" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Chemistry Building (bldg 187) - FLOOR 1
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="1170,35 1230,35 1230,180 1195,180 1195,410 1145,410 1145,180 1140,180 1140,385 1135,385 1135,430 220,430 220,265 90,265 90,45 620,45 620,40 1135,40 1135,105 1170,105"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="220" y="265" width="605" height="65"/>
  <rect class="hall" x="490" y="45" width="30" height="220"/>
  <text class="hall-lbl" x="523" y="298">Hallway</text>
  <text class="hall-lbl" x="313" y="298">Hallway</text>
  <text class="hall-lbl" x="733" y="298">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="1110,330 1140,330 1140,385 1110,385 1110,360 1065,360 1065,385 1025,385 1025,360 1090,360"/>
  <polygon class="room" points="620,330 685,330 685,430 620,430"/><text class="lblS" x="653" y="380">R142</text>
  <polygon class="room" points="685,330 765,330 765,430 685,430"/><text class="lbl" x="725" y="380">143</text>
  <polygon class="room" points="550,330 550,430 490,430 490,330"/><text class="lblS" x="520" y="380">141</text>
  <polygon class="room" points="755,45 755,265 700,265 700,240 620,240 620,45"/>
  <rect class="room" x="90" y="45" width="130" height="220"/><text class="lbl" x="155" y="155">134</text>
  <rect class="room" x="220" y="45" width="140" height="220"/><text class="lbl" x="290" y="155">133</text>
  <rect class="room" x="360" y="45" width="130" height="220"/><text class="lbl" x="425" y="155">132</text>
  <rect class="room" x="520" y="45" width="235" height="220"/><text class="lbl" x="638" y="155">130</text>
  <rect class="room" x="755" y="45" width="100" height="135"/><text class="lbl" x="805" y="113">128</text>
  <rect class="room" x="855" y="45" width="170" height="135"/><text class="lbl" x="940" y="113">127</text>
  <rect class="room" x="755" y="180" width="70" height="85"/><text class="lbl" x="790" y="223">129</text>
  <rect class="room" x="825" y="180" width="135" height="85"/><text class="lbl" x="893" y="223">125</text>
  <rect class="room" x="960" y="180" width="65" height="85"/><text class="lblS" x="993" y="223">126</text>
  <rect class="room" x="220" y="330" width="70" height="100"/><text class="lbl" x="255" y="380">137</text>
  <rect class="room" x="290" y="330" width="135" height="100"/><text class="lbl" x="358" y="380">138</text>
  <rect class="room" x="425" y="330" width="65" height="100"/><text class="lblS" x="458" y="380">140</text>
  <rect class="room" x="550" y="330" width="70" height="100"/>
  <rect class="room" x="765" y="330" width="60" height="100"/><text class="lblS" x="795" y="380">144</text>
  <rect class="room" x="1145" y="330" width="50" height="80"/>

  <polygon class="floor-edge" points="1170,35 1230,35 1230,180 1195,180 1195,410 1145,410 1145,180 1140,180 1140,385 1135,385 1135,430 220,430 220,265 90,265 90,45 620,45 620,40 1135,40 1135,105 1170,105"/>
  <line class="door" x1="1069" y1="40" x2="1105" y2="40"/><text class="exit" x="1087" y="95">EXIT</text>
  <line class="door" x1="126" y1="265" x2="90" y2="265"/><text class="exit" x="108" y="210">EXIT</text>
</svg>
