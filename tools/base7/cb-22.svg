<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1474 943" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Chemistry Building (bldg 187) - FLOOR 2
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="35,10 960,10 960,20 965,20 965,60 1020,60 1020,70 1140,70 1140,145 1410,145 1410,650 805,650 805,875 655,875 655,640 565,640 565,810 570,810 570,870 425,870 425,655 110,655 110,550 40,550 40,435 60,435 60,385 30,385 30,330 0,330 0,125 35,125"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="110" y="20" width="855" height="40"/>
  <rect class="hall" x="35" y="60" width="195" height="85"/>
  <rect class="hall" x="360" y="60" width="295" height="85"/>
  <rect class="hall" x="755" y="60" width="265" height="85"/>
  <rect class="hall" x="655" y="435" width="310" height="80"/>
  <rect class="hall" x="0" y="125" width="30" height="205"/>
  <rect class="hall" x="30" y="125" width="5" height="20"/>
  <text class="hall-lbl" x="508" y="83">Hallway</text>
  <text class="hall-lbl" x="858" y="83">Hallway</text>
  <text class="hall-lbl" x="133" y="103">Hallway</text>
  <text class="hall-lbl" x="808" y="473">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="270,145 425,145 425,385 270,385"/>
  <polygon class="room" points="270,145 270,385 425,385 425,435 60,435 60,385 110,385 110,220 30,220 30,145"/><text class="lbl" x="194" y="299">231</text>
  <polygon class="room" points="1090,515 1090,650 965,650 965,515"/><text class="lbl" x="1028" y="583">241</text>
  <polygon class="room" points="570,810 570,870 425,870 425,810"/><text class="lblS" x="498" y="840">W289</text>
  <rect class="room" x="425" y="145" width="145" height="290"/><text class="lbl" x="498" y="290">229</text>
  <rect class="room" x="570" y="145" width="235" height="290"/><text class="lbl" x="688" y="290">228</text>
  <rect class="room" x="805" y="145" width="160" height="290"/><text class="lbl" x="885" y="290">227</text>
  <rect class="room" x="965" y="145" width="400" height="290"/><text class="lbl" x="1165" y="290">225</text>
  <rect class="room" x="30" y="220" width="80" height="165"/>
  <rect class="room" x="185" y="515" width="110" height="135"/><text class="lbl" x="240" y="583">234</text>
  <rect class="room" x="295" y="515" width="130" height="135"/><text class="lbl" x="360" y="583">235</text>
  <rect class="room" x="425" y="515" width="65" height="125"/><text class="lblS" x="458" y="578">236</text>
  <rect class="room" x="570" y="515" width="85" height="125"/><text class="lbl" x="613" y="578">238</text>
  <rect class="room" x="655" y="515" width="150" height="140"/>
  <rect class="room" x="805" y="515" width="80" height="135"/><text class="lbl" x="845" y="583">R239</text>
  <rect class="room" x="885" y="515" width="80" height="135"/><text class="lbl" x="925" y="583">240</text>
  <rect class="room" x="425" y="655" width="140" height="155"/><text class="lbl" x="495" y="733">W290</text>
  <rect class="room" x="655" y="655" width="150" height="105"/><text class="lbl" x="730" y="708">W292</text>
  <rect class="room" x="655" y="760" width="150" height="110"/><text class="lbl" x="730" y="815">W293</text>

  <rect class="core" x="1140" y="550" width="40" height="90"/>
  <g class="stair"><line x1="1149" y1="550" x2="1149" y2="640"/><line x1="1167" y1="550" x2="1167" y2="640"/></g>
  <rect class="core" x="1285" y="550" width="45" height="90"/>
  <g class="stair"><line x1="1294" y1="550" x2="1294" y2="640"/><line x1="1312" y1="550" x2="1312" y2="640"/></g>
  <rect class="core" x="110" y="560" width="30" height="85"/>
  <g class="stair"><line x1="119" y1="560" x2="119" y2="645"/><line x1="137" y1="560" x2="137" y2="645"/></g>
  <polygon class="floor-edge" points="35,10 960,10 960,20 965,20 965,60 1020,60 1020,70 1140,70 1140,145 1410,145 1410,650 805,650 805,875 655,875 655,640 565,640 565,810 570,810 570,870 425,870 425,655 110,655 110,550 40,550 40,435 60,435 60,385 30,385 30,330 0,330 0,125 35,125"/>
  <line class="door" x1="76" y1="550" x2="40" y2="550"/><text class="exit" x="58" y="495">EXIT</text>
  <line class="door" x1="1247" y1="650" x2="1211" y2="650"/><text class="exit" x="1229" y="595">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(147,810) rotate(283)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
