<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2195 1298" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Rentfrow Hall (bldg 211) - FLOOR 1
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="1065,50 1150,50 1150,55 1155,55 1155,785 1765,785 1765,1155 865,1155 865,1165 800,1165 800,1155 675,1155 675,1085 625,1085 625,1080 0,1080 0,230 1065,230"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="535" y="700" width="90" height="290"/>
  <rect class="hall" x="800" y="700" width="65" height="385"/>
  <rect class="hall" x="865" y="345" width="90" height="355"/>
  <rect class="hall" x="535" y="550" width="90" height="150"/>
  <rect class="hall" x="625" y="570" width="355" height="130"/>
  <rect class="hall" x="865" y="1085" width="90" height="70"/>
  <rect class="hall" x="800" y="1085" width="65" height="70"/>
  <text class="hall-lbl" x="758" y="633">Hallway</text>
  <text class="hall-lbl" transform="rotate(-90 578 768)" x="578" y="768">Hallway</text>
  <text class="hall-lbl" transform="rotate(-90 913 523)" x="913" y="523">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="420,230 520,230 520,305 420,305"/><text class="lbl" x="470" y="268">R129</text>
  <polygon class="room" points="535,230 625,230 625,550 580,550 580,370 535,370"/><text class="lbl" x="589" y="363">R130</text>
  <polygon class="room" points="1065,345 1065,450 965,450 965,345"/><text class="lbl" x="1015" y="398">R102</text>
  <polygon class="room" points="965,470 1065,470 1065,570 965,570"/><text class="lbl" x="1015" y="520">R101</text>
  <polygon class="room" points="1615,1085 1765,1085 1765,1155 1615,1155"/><text class="lbl" x="1690" y="1120">M117</text>
  <polygon class="room" points="675,1085 800,1085 800,1155 675,1155"/><text class="lbl" x="738" y="1120">110</text>
  <polygon class="room" points="1475,1085 1615,1085 1615,1155 1475,1155"/><text class="lbl" x="1545" y="1120">R115</text>
  <rect class="room" x="1065" y="50" width="85" height="100"/><text class="lbl" x="1108" y="100">103</text>
  <rect class="room" x="625" y="230" width="240" height="340"/><text class="lbl" x="745" y="400">100</text>
  <rect class="room" x="865" y="230" width="90" height="75"/>
  <rect class="room" x="1065" y="230" width="85" height="195"/>
  <rect class="room" x="965" y="305" width="100" height="40"/>
  <rect class="room" x="345" y="550" width="190" height="195"/>
  <rect class="room" x="0" y="700" width="535" height="380"/><text class="lbl" x="268" y="890">127</text>
  <rect class="room" x="625" y="700" width="175" height="140"/><text class="lbl" x="713" y="770">105</text>
  <rect class="room" x="865" y="700" width="100" height="190"/><text class="lbl" x="915" y="795">106</text>
  <rect class="room" x="965" y="785" width="495" height="370"/><text class="lbl" x="1213" y="970">114</text>
  <rect class="room" x="1460" y="785" width="305" height="300"/><text class="lbl" x="1613" y="935">119</text>
  <rect class="room" x="625" y="840" width="175" height="120"/><text class="lbl" x="713" y="900">107</text>
  <rect class="room" x="865" y="890" width="100" height="195"/><text class="lbl" x="915" y="988">108</text>
  <rect class="room" x="625" y="960" width="175" height="125"/><text class="lbl" x="713" y="1023">109</text>
  <rect class="room" x="955" y="1085" width="110" height="70"/><text class="lbl" x="1010" y="1120">111</text>
  <rect class="room" x="800" y="1155" width="65" height="10"/><text class="lblS" x="833" y="1160">R110</text>

  <polygon class="floor-edge" points="1065,50 1150,50 1150,55 1155,55 1155,785 1765,785 1765,1155 865,1155 865,1165 800,1165 800,1155 675,1155 675,1085 625,1085 625,1080 0,1080 0,230 1065,230"/>
  <line class="door" x1="826" y1="230" x2="862" y2="230"/><text class="exit" x="844" y="285">EXIT</text>
  <line class="door" x1="980" y1="230" x2="1016" y2="230"/><text class="exit" x="998" y="285">EXIT</text>
  <line class="door" x1="0" y1="629" x2="0" y2="593"/><text class="exit" x="55" y="611">EXIT</text>
  <line class="door" x1="1729" y1="785" x2="1765" y2="785"/><text class="exit" x="1747" y="840">EXIT</text>
  <line class="door" x1="604" y1="1080" x2="568" y2="1080"/><text class="exit" x="586" y="1025">EXIT</text>
  <line class="door" x1="935" y1="1155" x2="899" y2="1155"/><text class="exit" x="917" y="1100">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(2118,1144) rotate(14)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
