<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1493 920" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Chemistry Building (bldg 187) - FLOOR 2
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="920,65 1050,65 1050,70 1405,70 1405,130 1495,130 1495,320 1390,320 1390,340 1410,340 1410,780 1145,780 1145,855 1015,855 1015,875 960,875 960,855 475,855 475,785 230,785 230,570 225,570 225,510 230,510 230,310 970,310 970,170 540,170 540,160 230,160 230,70 920,70"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="225" y="510" width="825" height="60"/>
  <rect class="hall" x="1145" y="510" width="245" height="60"/>
  <rect class="hall" x="475" y="570" width="170" height="100"/>
  <rect class="hall" x="533" y="570" width="60" height="15"/>
  <text class="hall-lbl" x="638" y="538">Hallway</text>
  <text class="hall-lbl" x="373" y="538">Hallway</text>
  <text class="hall-lbl" x="903" y="538">Hallway</text>
  <text class="hall-lbl" x="1268" y="538">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="1015,65 1015,160 920,160 920,65"/>
  <polygon class="room" points="475,320 540,320 540,510 475,510"/><text class="lblS" x="508" y="415">H200A</text>
  <polygon class="room" points="1290,320 1390,320 1390,415 1290,415"/><text class="lbl" x="1340" y="368">219</text>
  <polygon class="room" points="805,320 805,510 735,510 735,475 690,475 690,455 675,475 675,510 620,510 620,320"/><text class="lbl" x="713" y="410">214</text>
  <polygon class="room" points="540,375 585,375 585,395 620,395 620,455 600,455 600,510 540,510"/><text class="lbl" x="575" y="442">213</text>
  <polygon class="room" points="1060,540 1110,540 1110,600 1075,600 1075,555 1060,555"/>
  <polygon class="room" points="1015,670 1090,670 1090,725 1015,725"/><text class="lblS" x="1053" y="698">R204B</text>
  <polygon class="room" points="1290,235 1290,265 1240,310 1215,310 1215,235"/>
  <rect class="room" x="970" y="130" width="525" height="190"/>
  <rect class="room" x="230" y="320" width="245" height="190"/><text class="lbl" x="353" y="415">211</text>
  <rect class="room" x="1015" y="320" width="275" height="190"/><text class="lbl" x="1153" y="415">217</text>
  <rect class="room" x="805" y="340" width="115" height="170"/><text class="lbl" x="863" y="425">215</text>
  <rect class="room" x="920" y="340" width="95" height="170"/><text class="lbl" x="968" y="425">216</text>
  <rect class="room" x="1290" y="415" width="100" height="95"/><text class="lbl" x="1340" y="463">218</text>
  <rect class="room" x="230" y="570" width="245" height="210"/><text class="lbl" x="353" y="675">201</text>
  <rect class="room" x="645" y="570" width="325" height="285"/><text class="lbl" x="808" y="713">203</text>
  <rect class="room" x="1145" y="570" width="245" height="210"/><text class="lbl" x="1268" y="675">205</text>
  <rect class="room" x="475" y="725" width="110" height="130"/><text class="lbl" x="530" y="790">202</text>
  <rect class="room" x="970" y="725" width="175" height="130"/><text class="lbl" x="1058" y="790">204</text>

  <rect class="core" x="600" y="70" width="70" height="30"/>
  <g class="stair"><line x1="600" y1="79" x2="670" y2="79"/><line x1="600" y1="97" x2="670" y2="97"/></g>
  <rect class="core" x="735" y="70" width="45" height="60"/>
  <g class="stair"><line x1="735" y1="79" x2="780" y2="79"/><line x1="735" y1="97" x2="780" y2="97"/><line x1="735" y1="115" x2="780" y2="115"/></g>
  <rect class="core" x="1240" y="70" width="50" height="60"/>
  <g class="stair"><line x1="1240" y1="79" x2="1290" y2="79"/><line x1="1240" y1="97" x2="1290" y2="97"/><line x1="1240" y1="115" x2="1290" y2="115"/></g>
  <rect class="core" x="540" y="130" width="45" height="40"/>
  <g class="stair"><line x1="540" y1="139" x2="585" y2="139"/><line x1="540" y1="157" x2="585" y2="157"/></g>
  <rect class="core" x="1145" y="160" width="70" height="10"/>
  <g class="stair"><line x1="1145" y1="169" x2="1215" y2="169"/></g>
  <rect class="core" x="540" y="320" width="45" height="20"/>
  <g class="stair"><line x1="549" y1="320" x2="549" y2="340"/><line x1="567" y1="320" x2="567" y2="340"/></g>
  <rect class="core" x="600" y="670" width="45" height="55"/>
  <g class="stair"><line x1="600" y1="679" x2="645" y2="679"/><line x1="600" y1="697" x2="645" y2="697"/><line x1="600" y1="715" x2="645" y2="715"/></g>
  <rect class="core" x="970" y="690" width="45" height="35"/>
  <g class="stair"><line x1="970" y1="699" x2="1015" y2="699"/><line x1="970" y1="717" x2="1015" y2="717"/></g>
  <rect class="core" x="970" y="855" width="45" height="20"/>
  <g class="stair"><line x1="970" y1="864" x2="1015" y2="864"/></g>
  <polygon class="floor-edge" points="920,65 1050,65 1050,70 1405,70 1405,130 1495,130 1495,320 1390,320 1390,340 1410,340 1410,780 1145,780 1145,855 1015,855 1015,875 960,875 960,855 475,855 475,785 230,785 230,570 225,570 225,510 230,510 230,310 970,310 970,170 540,170 540,160 230,160 230,70 920,70"/>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(1263,845) rotate(15)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
