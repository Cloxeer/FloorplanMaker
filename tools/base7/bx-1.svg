<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 806 680" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Biology Annex (bldg 82) - FLOOR 1
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="0,0 755,0 755,65 785,65 785,70 825,70 825,330 450,330 450,355 470,355 470,330 805,330 805,680 495,680 495,650 490,650 490,660 460,660 460,630 495,630 495,445 445,445 445,470 410,470 410,495 415,495 415,680 280,680 280,590 0,590 0,280 135,280 135,330 275,330 275,280 0,280"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="280" y="280" width="170" height="50"/>
  <rect class="hall" x="415" y="330" width="35" height="115"/>
  <rect class="hall" x="755" y="70" width="30" height="260"/>
  <rect class="hall" x="460" y="280" width="295" height="50"/>
  <rect class="hall" x="450" y="280" width="10" height="50"/>
  <text class="hall-lbl" x="533" y="303">Hallway</text>
  <text class="hall-lbl" transform="rotate(-90 768 203)" x="768" y="203">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="135,330 280,330 280,445 135,445"/><text class="lbl" x="208" y="388">113</text>
  <polygon class="room" points="280,405 410,405 410,445 280,445"/><text class="lblS" x="345" y="425">103A</text>
  <polygon class="room" points="215,445 410,445 410,495 280,495 280,590 215,590"/><text class="lbl" x="287" y="498">103</text>
  <polygon class="room" points="495,445 450,445 450,405 495,405"/><text class="lblS" x="473" y="425">R100B</text>
  <rect class="room" x="0" y="0" width="95" height="280"/><text class="lbl" x="48" y="140">110</text>
  <rect class="room" x="95" y="0" width="375" height="280"/><text class="lbl" x="283" y="140">105</text>
  <rect class="room" x="470" y="0" width="285" height="280"/><text class="lbl" x="613" y="140">104</text>
  <rect class="room" x="325" y="65" width="235" height="105"/><text class="lbl" x="443" y="118">111A</text>
  <rect class="room" x="280" y="330" width="130" height="75"/><text class="lbl" x="345" y="368">103F</text>
  <rect class="room" x="495" y="330" width="310" height="350"/><text class="lbl" x="650" y="505">102</text>
  <rect class="room" x="0" y="355" width="135" height="235"/><text class="lbl" x="68" y="473">114</text>
  <rect class="room" x="410" y="355" width="5" height="90"/><text class="lblS" x="413" y="400">112</text>
  <rect class="room" x="450" y="355" width="45" height="50"/><text class="lblS" x="473" y="380">100</text>
  <rect class="room" x="135" y="445" width="80" height="50"/><text class="lblS" x="175" y="470">103C</text>
  <rect class="room" x="135" y="495" width="80" height="95"/><text class="lbl" x="175" y="543">103B</text>
  <rect class="room" x="280" y="495" width="135" height="185"/><text class="lbl" x="348" y="588">101</text>

  <rect class="core" x="755" y="65" width="30" height="5"/>
  <g class="stair"><line x1="764" y1="65" x2="764" y2="70"/><line x1="782" y1="65" x2="782" y2="70"/></g>
  <rect class="core" x="795" y="70" width="30" height="35"/>
  <g class="stair"><line x1="795" y1="79" x2="825" y2="79"/><line x1="795" y1="97" x2="825" y2="97"/></g>
  <rect class="core" x="380" y="630" width="30" height="30"/>
  <g class="stair"><line x1="380" y1="639" x2="410" y2="639"/><line x1="380" y1="657" x2="410" y2="657"/></g>
  <rect class="core" x="460" y="630" width="30" height="30"/>
  <g class="stair"><line x1="460" y1="639" x2="490" y2="639"/><line x1="460" y1="657" x2="490" y2="657"/></g>
  <polygon class="floor-edge" points="0,0 755,0 755,65 785,65 785,70 825,70 825,330 450,330 450,355 470,355 470,330 805,330 805,680 495,680 495,650 490,650 490,660 460,660 460,630 495,630 495,445 445,445 445,470 410,470 410,495 415,495 415,680 280,680 280,590 0,590 0,280 135,280 135,330 275,330 275,280 0,280"/>
  <line class="door" x1="28" y1="280" x2="64" y2="280"/><text class="exit" x="46" y="335">EXIT</text>
  <line class="door" x1="415" y1="599" x2="415" y2="635"/><text class="exit" x="360" y="617">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(75,605) rotate(192)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
