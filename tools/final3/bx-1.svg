<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 1088" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Biology Annex (bldg 82) - FLOOR 1
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="40,90 140,90 140,100 1420,100 1420,930 40,930"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="40" y="445" width="880" height="75"/>
  <rect class="hall" x="210" y="520" width="40" height="35"/>
  <rect class="hall" x="450" y="520" width="50" height="35"/>
  <rect class="hall" x="728" y="520" width="107" height="80"/>
  <rect class="hall" x="670" y="520" width="58" height="190"/>
  <rect class="hall" x="640" y="710" width="88" height="75"/>
  <rect class="hall" x="665" y="785" width="63" height="145"/>
  <rect class="hall" x="728" y="875" width="107" height="55"/>
  <rect class="hall" x="595" y="520" width="75" height="60"/>
  <text class="hall-lbl" x="478" y="483">Hallway</text>
  <text class="hall-lbl" x="713" y="513">Hallway</text>
  <text class="hall-lbl" x="203" y="483">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="250,520 450,520 450,555 500,555 500,710 210,710 210,555 250,555"/><text class="lbl" x="354" y="620">113</text>
  <polygon class="room" points="500,645 595,645 595,710 500,710"/><text class="lblS" x="548" y="678">103A</text>
  <polygon class="room" points="340,710 640,710 640,785 450,785 450,930 340,930"/><text class="lbl" x="410" y="750">103</text>
  <rect class="room" x="730" y="645" width="100" height="55"/><text class="lblS" x="780" y="673">R100B</text>
  <rect class="room" x="500" y="520" width="95" height="125"/><text class="lbl" x="548" y="583">103F</text>
  <rect class="room" x="595" y="580" width="75" height="130"/><text class="lbl" x="633" y="645">112</text>
  <rect class="room" x="730" y="600" width="100" height="45"/><text class="lblS" x="780" y="623">J100</text>
  <rect class="room" x="210" y="710" width="130" height="115"/><text class="lbl" x="275" y="768">103C</text>
  <rect class="room" x="210" y="825" width="130" height="105"/><text class="lbl" x="275" y="878">103B</text>
  <polygon class="room" points="40,90 140,90 140,290 160,290 160,445 40,445"/><text class="lbl" x="95" y="276">110</text>
  <polygon class="room" points="140,100 515,100 515,270 755,270 755,445 160,445 160,290 140,290"/><text class="lbl" x="408" y="292">105</text>
  <polygon class="room" points="755,270 905,270 905,100 1205,100 1205,700 1135,700 1135,445 755,445"/><text class="lbl" x="1029" y="324">104</text>
  <rect class="room" x="730" y="700" width="100" height="175"/><text class="lbl" x="780" y="788">R100A</text>
  <rect class="room" x="40" y="520" width="170" height="410"/><text class="lbl" x="125" y="725">114</text>
  <rect class="room" x="455" y="790" width="208" height="140"/><text class="lbl" x="559" y="860">101</text>
  <rect class="room" x="515" y="100" width="390" height="170"/><text class="lbl" x="710" y="185">111A</text>
  <rect class="room" x="835" y="520" width="300" height="410"/><text class="lbl" x="985" y="725">102</text>
  <rect class="room" x="920" y="445" width="215" height="75"/><text class="lbl" x="1028" y="483">102A</text>
  <rect class="room" x="1205" y="100" width="215" height="330"/><text class="lbl" x="1313" y="265">109</text>
  <rect class="room" x="1205" y="430" width="75" height="85"/><text class="lbl" x="1243" y="473">109B</text>
  <rect class="room" x="1280" y="430" width="140" height="85"/><text class="lbl" x="1350" y="473">109A</text>
  <rect class="room" x="1205" y="525" width="215" height="90"/>
  <rect class="room" x="1205" y="620" width="215" height="85"/><text class="lbl" x="1313" y="663">106A</text>
  <rect class="room" x="1135" y="710" width="285" height="220"/><text class="lbl" x="1278" y="820">106</text>

  <polygon class="floor-edge" points="40,90 140,90 140,100 1420,100 1420,930 40,930"/>
  <line class="door" x1="672" y1="930" x2="722" y2="930"/><text class="exit" x="697" y="985">EXIT</text>
  <line class="door" x1="40" y1="450" x2="40" y2="515"/><text class="exit" x="40" y="538">EXIT</text>
  <line class="door" x1="1295" y1="100" x2="1345" y2="100"/><text class="exit" x="1320" y="155">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(96,960) rotate(192)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
