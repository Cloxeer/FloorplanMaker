<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1493 980" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Chemistry Building (bldg 187) - FLOOR 2
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="225,315 1395,315 1395,780 1145,780 1145,855 475,855 475,785 225,785"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="230" y="510" width="1160" height="75"/>
  <rect class="hall" x="480" y="585" width="165" height="85"/>
  <rect class="hall" x="975" y="585" width="170" height="85"/>
  <text class="hall-lbl" x="808" y="548">Hallway</text>
  <text class="hall-lbl" x="463" y="548">Hallway</text>
  <text class="hall-lbl" x="1158" y="548">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="475,320 560,320 560,372 530,372 530,510 475,510"/><text class="lbl" x="518" y="346">H200A</text>
  <rect class="room" x="1290" y="320" width="100" height="95"/><text class="lbl" x="1340" y="368">219</text>
  <rect class="room" x="620" y="320" width="185" height="190"/><text class="lbl" x="713" y="415">214</text>
  <polygon class="room" points="530,372 560,372 560,395 620,395 620,510 530,510"/><text class="lbl" x="573" y="448">213</text>
  <rect class="room" x="1030" y="670" width="60" height="60"/><text class="lblS" x="1060" y="700">R204B</text>
  <rect class="room" x="230" y="320" width="245" height="190"/><text class="lbl" x="353" y="415">211</text>
  <rect class="room" x="1010" y="320" width="280" height="190"/><text class="lbl" x="1150" y="415">217</text>
  <rect class="room" x="805" y="320" width="100" height="190"/><text class="lbl" x="855" y="415">215</text>
  <rect class="room" x="905" y="320" width="105" height="190"/><text class="lbl" x="958" y="415">216</text>
  <rect class="room" x="1290" y="415" width="100" height="95"/><text class="lbl" x="1340" y="463">218</text>
  <rect class="room" x="230" y="585" width="245" height="190"/><text class="lbl" x="353" y="680">201</text>
  <rect class="room" x="645" y="585" width="325" height="260"/><text class="lbl" x="808" y="715">203</text>
  <rect class="room" x="1145" y="585" width="245" height="190"/><text class="lbl" x="1268" y="680">205</text>
  <rect class="room" x="480" y="735" width="105" height="110"/><text class="lbl" x="533" y="790">202</text>
  <rect class="room" x="970" y="735" width="175" height="110"/><text class="lbl" x="1058" y="790">204</text>
  <rect class="core" x="560" y="320" width="60" height="75"/>
  <g class="icon" transform="translate(572,340) scale(1.5)"><path d="m21 16-3-3h6zm0-8-3 3h6zm-12-8h-6c-1.654 0-3 1.346-3 3v21h9zm11 6.171v-3.171c0-1.654-1.346-3-3-3h-6v24h9v-6.171l-4-4v-3.657l4-4z" fill="#5f6368"/></g>
  <rect class="room" x="530" y="670" width="60" height="60"/><text class="lblS" x="560" y="700">R202A</text>

  <rect class="core" x="600" y="670" width="45" height="55"/>
  <g class="stair"><line x1="600" y1="679" x2="645" y2="679"/><line x1="600" y1="697" x2="645" y2="697"/><line x1="600" y1="715" x2="645" y2="715"/></g>
  <rect class="core" x="975" y="670" width="50" height="55"/>
  <g class="stair"><line x1="975" y1="679" x2="1025" y2="679"/><line x1="975" y1="697" x2="1025" y2="697"/><line x1="975" y1="715" x2="1025" y2="715"/></g>
  <text class="lblS" x="1000" y="705">2ST1</text>
  <polygon class="floor-edge" points="225,315 1395,315 1395,780 1145,780 1145,855 475,855 475,785 225,785"/>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(1275,875) rotate(15)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
