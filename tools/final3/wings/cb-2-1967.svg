<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1474 943" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Chemistry Building (bldg 187) - FLOOR 2
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="25,145 235,145 235,65 360,65 360,145 630,145 630,65 755,65 755,145 1020,145 1020,65 1140,65 1140,145 1370,145 1370,650 800,650 800,905 425,905 425,650 25,650"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="25" y="435" width="1345" height="80"/>
  <rect class="hall" x="500" y="515" width="90" height="135"/>
  <rect class="hall" x="570" y="650" width="85" height="255"/>
  <rect class="hall" x="1095" y="515" width="130" height="35"/>
  <rect class="hall" x="25" y="550" width="160" height="100"/>
  <rect class="hall" x="1175" y="550" width="195" height="100"/>
  <text class="hall-lbl" x="698" y="473">Hallway</text>
  <text class="hall-lbl" x="303" y="473">Hallway</text>
  <text class="hall-lbl" x="1093" y="473">Hallway</text>
  <text class="hall-lbl" transform="rotate(-90 158 598)" x="158" y="598">Hallway</text>

  <!-- ROOMS -->
  <rect class="room" x="270" y="145" width="125" height="220"/><text class="lbl" x="333" y="255">231B</text>
  <polygon class="room" points="25,145 270,145 270,365 395,365 395,435 25,435 25,385 90,385 90,215 25,215"/><text class="lbl" x="186" y="302">231</text>
  <rect class="room" x="995" y="515" width="100" height="135"/><text class="lbl" x="1045" y="583">241</text>
  <rect class="room" x="425" y="810" width="145" height="95"/><text class="lbl" x="498" y="858">W289</text>
  <rect class="room" x="395" y="145" width="200" height="290"/><text class="lbl" x="495" y="290">229</text>
  <rect class="room" x="595" y="145" width="195" height="290"/><text class="lbl" x="693" y="290">228</text>
  <rect class="room" x="790" y="145" width="195" height="290"/><text class="lbl" x="888" y="290">227</text>
  <rect class="room" x="985" y="145" width="385" height="290"/><text class="lbl" x="1178" y="290">225</text>
  <rect class="room" x="25" y="215" width="65" height="170"/><text class="lblS" x="58" y="300">231A</text>
  <rect class="room" x="185" y="515" width="110" height="135"/><text class="lbl" x="240" y="583">234</text>
  <rect class="room" x="295" y="515" width="100" height="135"/><text class="lbl" x="345" y="583">235</text>
  <rect class="room" x="395" y="515" width="105" height="135"/><text class="lbl" x="448" y="583">236</text>
  <rect class="room" x="590" y="515" width="95" height="135"/><text class="lbl" x="638" y="583">238</text>
  <rect class="room" x="685" y="515" width="100" height="135"/>
  <rect class="room" x="785" y="515" width="105" height="135"/><text class="lbl" x="838" y="583">R239</text>
  <rect class="room" x="890" y="515" width="105" height="135"/><text class="lbl" x="943" y="583">240</text>
  <rect class="room" x="425" y="650" width="145" height="160"/><text class="lbl" x="498" y="730">W290</text>
  <rect class="room" x="655" y="650" width="145" height="110"/><text class="lbl" x="728" y="705">W292</text>
  <rect class="room" x="655" y="760" width="145" height="110"/><text class="lbl" x="728" y="815">W293</text>
  <rect class="core" x="1095" y="550" width="80" height="100"/>
  <g class="icon" transform="translate(1111,576) scale(2)"><path d="m21 16-3-3h6zm0-8-3 3h6zm-12-8h-6c-1.654 0-3 1.346-3 3v21h9zm11 6.171v-3.171c0-1.654-1.346-3-3-3h-6v24h9v-6.171l-4-4v-3.657l4-4z" fill="#5f6368"/></g>

  <rect class="core" x="45" y="555" width="95" height="85"/>
  <g class="stair"><line x1="54" y1="555" x2="54" y2="640"/><line x1="72" y1="555" x2="72" y2="640"/><line x1="90" y1="555" x2="90" y2="640"/><line x1="108" y1="555" x2="108" y2="640"/><line x1="126" y1="555" x2="126" y2="640"/></g>
  <rect class="core" x="1230" y="555" width="100" height="85"/>
  <g class="stair"><line x1="1239" y1="555" x2="1239" y2="640"/><line x1="1257" y1="555" x2="1257" y2="640"/><line x1="1275" y1="555" x2="1275" y2="640"/><line x1="1293" y1="555" x2="1293" y2="640"/><line x1="1311" y1="555" x2="1311" y2="640"/><line x1="1329" y1="555" x2="1329" y2="640"/></g>
  <polygon class="floor-edge" points="25,145 235,145 235,65 360,65 360,145 630,145 630,65 755,65 755,145 1020,145 1020,65 1140,65 1140,145 1370,145 1370,650 800,650 800,905 425,905 425,650 25,650"/>
  <line class="door" x1="25" y1="560" x2="25" y2="610"/><text class="exit" x="25" y="640">EXIT</text>
  <line class="door" x1="1370" y1="560" x2="1370" y2="610"/><text class="exit" x="1370" y="640">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(147,810) rotate(283)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
