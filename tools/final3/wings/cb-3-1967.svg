<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1282 752" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Chemistry Building (bldg 187) - FLOOR 3
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="25,95 235,95 235,25 350,25 350,95 585,95 585,25 700,25 700,95 935,95 935,25 1050,25 1050,95 1255,95 1255,540 735,540 735,735 405,735 405,540 25,540"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="25" y="350" width="1230" height="75"/>
  <rect class="hall" x="465" y="425" width="85" height="115"/>
  <rect class="hall" x="485" y="540" width="50" height="15"/>
  <rect class="hall" x="535" y="540" width="70" height="195"/>
  <rect class="hall" x="1000" y="425" width="118" height="35"/>
  <rect class="hall" x="25" y="425" width="55" height="35"/>
  <text class="hall-lbl" x="638" y="388">Hallway</text>
  <text class="hall-lbl" x="273" y="388">Hallway</text>
  <text class="hall-lbl" x="1003" y="388">Hallway</text>

  <!-- ROOMS -->
  <rect class="room" x="25" y="95" width="355" height="255"/><text class="lbl" x="203" y="223">331</text>
  <rect class="room" x="380" y="95" width="170" height="255"/><text class="lbl" x="465" y="223">329</text>
  <rect class="room" x="550" y="95" width="180" height="255"/><text class="lbl" x="640" y="223">328</text>
  <rect class="room" x="730" y="95" width="175" height="255"/><text class="lbl" x="818" y="223">327</text>
  <rect class="room" x="905" y="95" width="350" height="255"/><text class="lbl" x="1080" y="223">325</text>
  <rect class="room" x="200" y="425" width="90" height="115"/><text class="lbl" x="245" y="483">334</text>
  <rect class="room" x="290" y="425" width="85" height="115"/><text class="lbl" x="333" y="483">335</text>
  <rect class="room" x="375" y="425" width="90" height="115"/><text class="lbl" x="420" y="483">336</text>
  <rect class="room" x="550" y="425" width="75" height="115"/><text class="lbl" x="588" y="483">338</text>
  <rect class="room" x="625" y="425" width="95" height="115"/>
  <rect class="room" x="720" y="425" width="95" height="115"/><text class="lbl" x="768" y="483">R339</text>
  <rect class="room" x="815" y="425" width="90" height="115"/><text class="lbl" x="860" y="483">340</text>
  <rect class="room" x="905" y="425" width="95" height="115"/><text class="lbl" x="953" y="483">341</text>
  <rect class="room" x="410" y="555" width="125" height="180"/><text class="lbl" x="473" y="645">W374</text>
  <rect class="room" x="605" y="545" width="130" height="95"/><text class="lbl" x="670" y="593">W376</text>
  <rect class="room" x="605" y="640" width="130" height="95"/><text class="lbl" x="670" y="688">W377</text>
  <rect class="room" x="80" y="425" width="55" height="30"/>
  <rect class="room" x="135" y="425" width="60" height="30"/>
  <rect class="room" x="1118" y="425" width="47" height="30"/>
  <rect class="room" x="1165" y="425" width="48" height="30"/>
  <rect class="room" x="1213" y="425" width="42" height="30"/>
  <rect class="core" x="1000" y="460" width="70" height="80"/>
  <g class="icon" transform="translate(1014,479) scale(1.75)"><path d="m21 16-3-3h6zm0-8-3 3h6zm-12-8h-6c-1.654 0-3 1.346-3 3v21h9zm11 6.171v-3.171c0-1.654-1.346-3-3-3h-6v24h9v-6.171l-4-4v-3.657l4-4z" fill="#5f6368"/></g>

  <rect class="core" x="30" y="460" width="165" height="80"/>
  <g class="stair"><line x1="39" y1="460" x2="39" y2="540"/><line x1="57" y1="460" x2="57" y2="540"/><line x1="75" y1="460" x2="75" y2="540"/><line x1="93" y1="460" x2="93" y2="540"/><line x1="111" y1="460" x2="111" y2="540"/><line x1="129" y1="460" x2="129" y2="540"/><line x1="147" y1="460" x2="147" y2="540"/><line x1="165" y1="460" x2="165" y2="540"/><line x1="183" y1="460" x2="183" y2="540"/></g>
  <rect class="core" x="1070" y="460" width="185" height="80"/>
  <g class="stair"><line x1="1079" y1="460" x2="1079" y2="540"/><line x1="1097" y1="460" x2="1097" y2="540"/><line x1="1115" y1="460" x2="1115" y2="540"/><line x1="1133" y1="460" x2="1133" y2="540"/><line x1="1151" y1="460" x2="1151" y2="540"/><line x1="1169" y1="460" x2="1169" y2="540"/><line x1="1187" y1="460" x2="1187" y2="540"/><line x1="1205" y1="460" x2="1205" y2="540"/><line x1="1223" y1="460" x2="1223" y2="540"/><line x1="1241" y1="460" x2="1241" y2="540"/></g>
  <rect class="core" x="235" y="25" width="115" height="70"/>
  <g class="stair"><line x1="235" y1="34" x2="350" y2="34"/><line x1="235" y1="52" x2="350" y2="52"/><line x1="235" y1="70" x2="350" y2="70"/><line x1="235" y1="88" x2="350" y2="88"/></g>
  <rect class="core" x="585" y="25" width="115" height="70"/>
  <g class="stair"><line x1="585" y1="34" x2="700" y2="34"/><line x1="585" y1="52" x2="700" y2="52"/><line x1="585" y1="70" x2="700" y2="70"/><line x1="585" y1="88" x2="700" y2="88"/></g>
  <rect class="core" x="935" y="25" width="115" height="70"/>
  <g class="stair"><line x1="935" y1="34" x2="1050" y2="34"/><line x1="935" y1="52" x2="1050" y2="52"/><line x1="935" y1="70" x2="1050" y2="70"/><line x1="935" y1="88" x2="1050" y2="88"/></g>
  <polygon class="floor-edge" points="25,95 235,95 235,25 350,25 350,95 585,95 585,25 700,25 700,95 935,95 935,25 1050,25 1050,95 1255,95 1255,540 735,540 735,735 405,735 405,540 25,540"/>
  <line class="door" x1="25" y1="470" x2="25" y2="530"/><text class="exit" x="25" y="555">EXIT</text>
  <line class="door" x1="1255" y1="470" x2="1255" y2="530"/><text class="exit" x="1255" y="555">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(164,651) rotate(280)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
