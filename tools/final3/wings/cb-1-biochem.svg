<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1161 809" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Chemistry Building (bldg 187) - FLOOR 1
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="475,40 1060,40 1060,290 985,290 985,425 940,425 940,805 440,805 440,765 315,765 315,715 75,715 75,415 360,415 360,225 440,225 440,78 475,78"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="360" y="290" width="625" height="95"/>
  <rect class="hall" x="360" y="225" width="80" height="65"/>
  <rect class="hall" x="440" y="385" width="205" height="35"/>
  <rect class="hall" x="775" y="385" width="210" height="40"/>
  <rect class="hall" x="360" y="385" width="80" height="85"/>
  <rect class="hall" x="75" y="415" width="285" height="55"/>
  <rect class="hall" x="125" y="470" width="130" height="40"/>
  <rect class="hall" x="650" y="260" width="95" height="30"/>
  <text class="hall-lbl" x="673" y="338">Hallway</text>
  <text class="hall-lbl" x="888" y="358">Hallway</text>
  <text class="hall-lbl" x="458" y="353">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="475,40 650,40 650,170 440,170 440,78 475,78"/><text class="lbl" x="549" y="107">W157</text>
  <polygon class="room" points="650,40 1060,40 1060,290 745,290 745,260 650,260"/><text class="lbl" x="860" y="162">W156</text>
  <polygon class="room" points="440,170 540,170 540,290 440,290"/><text class="lbl" x="490" y="230">W159</text>
  <polygon class="room" points="540,170 650,170 650,290 540,290"/><text class="lbl" x="595" y="230">W158</text>
  <polygon class="room" points="75,470 125,470 125,510 180,510 180,715 75,715"/><text class="lbl" x="125" y="602">R161A</text>
  <polygon class="room" points="255,470 315,470 315,715 215,715 215,510 255,510"/><text class="lbl" x="267" y="600">R161B</text>
  <polygon class="room" points="180,510 215,510 215,715 180,715"/>
  <polygon class="room" points="315,470 375,470 375,565 315,565"/>
  <polygon class="room" points="375,470 440,470 440,565 375,565"/>
  <polygon class="room" points="315,565 440,565 440,600 315,600"/><text class="lblS" x="378" y="583">M161</text>
  <polygon class="room" points="315,600 440,600 440,765 315,765"/><text class="lbl" x="378" y="683">W115</text>
  <polygon class="room" points="440,420 560,420 595,445 645,420 665,398 710,388 755,398 775,420 830,450 855,425 940,425 940,805 440,805"/><text class="lbl" x="689" y="612">W153</text>

  <polygon class="floor-edge" points="475,40 1060,40 1060,290 985,290 985,425 940,425 940,805 440,805 440,765 315,765 315,715 75,715 75,415 360,415 360,225 440,225 440,78 475,78"/>
  <line class="door" x1="440" y1="90" x2="440" y2="130"/><text class="exit" x="415" y="110">EXIT</text>
  <line class="door" x1="365" y1="225" x2="435" y2="225"/><text class="exit" x="400" y="200">EXIT</text>
  <line class="door" x1="985" y1="340" x2="985" y2="385"/><text class="exit" x="1015" y="362">EXIT</text>
  <line class="door" x1="75" y1="420" x2="75" y2="465"/><text class="exit" x="45" y="442">EXIT</text>
  <line class="door" x1="427" y1="765" x2="391" y2="765"/><text class="exit" x="409" y="790">EXIT</text>
  <line class="door" x1="840" y1="805" x2="885" y2="805"/><text class="exit" x="862" y="825">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(152,132) rotate(283)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
