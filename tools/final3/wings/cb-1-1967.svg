<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -120 1636 764" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Chemistry Building (bldg 187) - FLOOR 1
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="105,55 1595,55 1595,565 1370,565 1370,595 105,595"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="105" y="360" width="1265" height="90"/>
  <rect class="hall" x="1370" y="55" width="147" height="510"/>
  <text class="hall-lbl" x="813" y="403">Hallway</text>
  <text class="hall-lbl" transform="rotate(-90 1448 343)" x="1448" y="343">Hallway</text>
  <text class="hall-lbl" x="403" y="403">Hallway</text>

  <!-- ROOMS -->
  <rect class="room" x="105" y="55" width="180" height="305"/><text class="lbl" x="195" y="208">134</text>
  <polygon class="room" points="920,450 1000,450 1000,595 920,595"/><text class="lbl" x="960" y="523">143</text>
  <polygon class="room" points="725,450 725,595 645,595 645,450"/><text class="lbl" x="685" y="523">141</text>
  <polygon class="room" points="815,450 905,450 905,595 815,595"/><text class="lbl" x="860" y="523">R142</text>
  <rect class="room" x="815" y="55" width="185" height="305"/><text class="lbl" x="908" y="208">130</text>
  <rect class="room" x="285" y="55" width="180" height="305"/><text class="lbl" x="375" y="208">133</text>
  <rect class="room" x="465" y="55" width="180" height="305"/><text class="lbl" x="555" y="208">132</text>
  <rect class="room" x="1000" y="55" width="135" height="170"/><text class="lbl" x="1068" y="140">128</text>
  <rect class="room" x="1135" y="55" width="235" height="170"/><text class="lbl" x="1253" y="140">127</text>
  <rect class="room" x="1000" y="225" width="90" height="135"/><text class="lbl" x="1045" y="293">129</text>
  <rect class="room" x="1090" y="225" width="180" height="135"/><text class="lbl" x="1180" y="293">125</text>
  <rect class="room" x="1270" y="225" width="100" height="135"/><text class="lbl" x="1320" y="293">126</text>
  <rect class="room" x="285" y="450" width="90" height="145"/><text class="lbl" x="330" y="523">137</text>
  <rect class="room" x="375" y="450" width="180" height="145"/><text class="lbl" x="465" y="523">138</text>
  <rect class="room" x="555" y="450" width="90" height="145"/><text class="lbl" x="600" y="523">140</text>
  <rect class="room" x="725" y="450" width="90" height="145"/>
  <rect class="room" x="1000" y="450" width="90" height="145"/><text class="lbl" x="1045" y="523">144</text>
  <rect class="room" x="1525" y="455" width="70" height="110"/><text class="lbl" x="1560" y="510">104E</text>
  <rect class="room" x="645" y="55" width="170" height="305"/><text class="lbl" x="730" y="208">131</text>
  <rect class="room" x="1525" y="60" width="70" height="130"/><text class="lbl" x="1560" y="125">113A</text>
  <rect class="room" x="1525" y="190" width="70" height="170"/><text class="lbl" x="1560" y="275">113</text>
  <rect class="core" x="1100" y="495" width="80" height="95"/>
  <g class="icon" transform="translate(1116,519) scale(2)"><path d="m21 16-3-3h6zm0-8-3 3h6zm-12-8h-6c-1.654 0-3 1.346-3 3v21h9zm11 6.171v-3.171c0-1.654-1.346-3-3-3h-6v24h9v-6.171l-4-4v-3.657l4-4z" fill="#5f6368"/></g>

  <rect class="core" x="105" y="495" width="180" height="100"/>
  <g class="stair"><line x1="114" y1="495" x2="114" y2="595"/><line x1="132" y1="495" x2="132" y2="595"/><line x1="150" y1="495" x2="150" y2="595"/><line x1="168" y1="495" x2="168" y2="595"/><line x1="186" y1="495" x2="186" y2="595"/><line x1="204" y1="495" x2="204" y2="595"/><line x1="222" y1="495" x2="222" y2="595"/><line x1="240" y1="495" x2="240" y2="595"/><line x1="258" y1="495" x2="258" y2="595"/><line x1="276" y1="495" x2="276" y2="595"/></g>
  <text class="lbl" x="195" y="575">ST1</text>
  <rect class="core" x="1180" y="495" width="190" height="100"/>
  <g class="stair"><line x1="1189" y1="495" x2="1189" y2="595"/><line x1="1207" y1="495" x2="1207" y2="595"/><line x1="1225" y1="495" x2="1225" y2="595"/><line x1="1243" y1="495" x2="1243" y2="595"/><line x1="1261" y1="495" x2="1261" y2="595"/><line x1="1279" y1="495" x2="1279" y2="595"/><line x1="1297" y1="495" x2="1297" y2="595"/><line x1="1315" y1="495" x2="1315" y2="595"/><line x1="1333" y1="495" x2="1333" y2="595"/><line x1="1351" y1="495" x2="1351" y2="595"/><line x1="1369" y1="495" x2="1369" y2="595"/></g>
  <text class="lbl" x="1275" y="575">ST2</text>
  <polygon class="floor-edge" points="105,55 1595,55 1595,565 1370,565 1370,595 105,595"/>
  <line class="door" x1="105" y1="395" x2="105" y2="430"/><text class="exit" x="105" y="468">EXIT</text>
  <line class="door" x1="1420" y1="55" x2="1480" y2="55"/><text class="exit" x="1450" y="110">EXIT</text>
  <line class="door" x1="1420" y1="565" x2="1480" y2="565"/><text class="exit" x="1450" y="620">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(130,-40) rotate(282)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
