<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1750 870" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Chemistry Building (bldg 187) - FLOOR 1
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="290,70 1630,70 1630,805 180,805 180,670 175,670 175,630 100,630 100,465 165,465 165,350 100,350 100,180 165,180 165,190 290,190"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="165" y="390" width="1230" height="75"/>
  <rect class="hall" x="1395" y="390" width="235" height="105"/>
  <rect class="hall" x="1315" y="70" width="80" height="320"/>
  <rect class="hall" x="735" y="70" width="115" height="95"/>
  <rect class="hall" x="500" y="345" width="120" height="45"/>
  <rect class="hall" x="945" y="345" width="120" height="45"/>
  <rect class="hall" x="190" y="350" width="85" height="40"/>
  <rect class="hall" x="535" y="465" width="85" height="40"/>
  <rect class="hall" x="755" y="465" width="85" height="40"/>
  <rect class="hall" x="975" y="465" width="90" height="40"/>
  <rect class="hall" x="285" y="465" width="115" height="40"/>
  <rect class="hall" x="1180" y="465" width="210" height="85"/>
  <rect class="hall" x="1460" y="330" width="85" height="60"/>
  <text class="hall-lbl" x="898" y="428">Hallway</text>
  <text class="hall-lbl" x="493" y="428">Hallway</text>
  <text class="hall-lbl" x="1308" y="428">Hallway</text>
  <text class="hall-lbl" x="788" y="98">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="1515,180 1620,180 1620,330 1610,330 1610,390 1545,390 1545,330 1515,330"/><text class="lbl" x="1569" y="276">R183A</text>
  <polygon class="room" points="190,465 285,465 285,505 400,505 400,670 175,670 175,505 190,505"/><text class="lbl" x="283" y="578">W192</text>
  <rect class="room" x="100" y="465" width="75" height="165"/><text class="lbl" x="138" y="548">W196</text>
  <rect class="room" x="400" y="465" width="115" height="105"/><text class="lbl" x="458" y="518">W193</text>
  <rect class="room" x="180" y="670" width="335" height="105"/><text class="lbl" x="348" y="723">W195</text>
  <polygon class="room" points="290,70 735,70 735,390 620,390 620,345 500,345 500,390 290,390"/><text class="lbl" x="511" y="225">W191</text>
  <rect class="room" x="735" y="165" width="115" height="105"/><text class="lbl" x="793" y="218">W187</text>
  <polygon class="room" points="850,70 1315,70 1315,390 1065,390 1065,345 945,345 945,390 850,390"/><text class="lbl" x="1085" y="225">W185</text>
  <polygon class="room" points="515,465 535,465 535,505 620,505 620,465 735,465 735,775 515,775"/><text class="lbl" x="627" y="627">W190</text>
  <polygon class="room" points="735,465 755,465 755,505 840,505 840,465 955,465 955,775 735,775"/><text class="lbl" x="847" y="627">W188</text>
  <polygon class="room" points="955,465 975,465 975,505 1065,505 1065,465 1175,465 1175,775 955,775"/><text class="lbl" x="1068" y="628">W186</text>
  <rect class="room" x="1415" y="495" width="215" height="310"/>
  <rect class="room" x="1180" y="560" width="105" height="85"/><text class="lbl" x="1233" y="603">J184</text>
  <rect class="room" x="400" y="570" width="115" height="100"/><text class="lbl" x="458" y="620">W194</text>
  <rect class="core" x="170" y="250" width="65" height="95"/>
  <g class="icon" transform="translate(183,278) scale(1.625)"><path d="m21 16-3-3h6zm0-8-3 3h6zm-12-8h-6c-1.654 0-3 1.346-3 3v21h9zm11 6.171v-3.171c0-1.654-1.346-3-3-3h-6v24h9v-6.171l-4-4v-3.657l4-4z" fill="#5f6368"/></g>
  <polygon class="room" points="1395,130 1495,130 1495,330 1460,330 1460,390 1415,390 1415,345 1395,345"/><text class="lbl" x="1444" y="247">R183B</text>

  <rect class="core" x="100" y="180" width="65" height="115"/>
  <g class="stair"><line x1="100" y1="189" x2="165" y2="189"/><line x1="100" y1="207" x2="165" y2="207"/><line x1="100" y1="225" x2="165" y2="225"/><line x1="100" y1="243" x2="165" y2="243"/><line x1="100" y1="261" x2="165" y2="261"/><line x1="100" y1="279" x2="165" y2="279"/></g>
  <rect class="core" x="1290" y="548" width="100" height="172"/>
  <g class="stair"><line x1="1290" y1="557" x2="1390" y2="557"/><line x1="1290" y1="575" x2="1390" y2="575"/><line x1="1290" y1="593" x2="1390" y2="593"/><line x1="1290" y1="611" x2="1390" y2="611"/><line x1="1290" y1="629" x2="1390" y2="629"/><line x1="1290" y1="647" x2="1390" y2="647"/><line x1="1290" y1="665" x2="1390" y2="665"/><line x1="1290" y1="683" x2="1390" y2="683"/><line x1="1290" y1="701" x2="1390" y2="701"/><line x1="1290" y1="719" x2="1390" y2="719"/></g>
  <polygon class="floor-edge" points="290,70 1630,70 1630,805 180,805 180,670 175,670 175,630 100,630 100,465 165,465 165,350 100,350 100,180 165,180 165,190 290,190"/>
  <line class="door" x1="175" y1="668" x2="175" y2="632"/><text class="exit" x="230" y="650">EXIT</text>
  <line class="door" x1="180" y1="743" x2="180" y2="707"/><text class="exit" x="235" y="725">EXIT</text>
  <line class="door" x1="800" y1="70" x2="836" y2="70"/><text class="exit" x="818" y="125">EXIT</text>
  <line class="door" x1="1335" y1="70" x2="1375" y2="70"/><text class="exit" x="1355" y="125">EXIT</text>
  <line class="door" x1="1630" y1="395" x2="1630" y2="435"/><text class="exit" x="1630" y="470">EXIT</text>
  <line class="door" x1="165" y1="390" x2="165" y2="430"/><text class="exit" x="165" y="465">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(110,765) rotate(187)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
