<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1728 944" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Hadley Hall (bldg 172) - FLOOR 2
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="125,75 280,75 280,90 1450,90 1450,70 1610,70 1610,840 1455,840 1455,765 760,765 760,875 585,875 585,765 280,765 280,840 125,840"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="690" y="605" width="220" height="35"/>
  <rect class="hall" x="770" y="640" width="140" height="105"/>
  <text class="hall-lbl" x="828" y="668">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="125,90 350,90 350,210 445,210 445,480 125,480"/><text class="lbl" x="276" y="316">222</text>
  <rect class="room" x="445" y="90" width="245" height="240"/><text class="lbl" x="568" y="210">221</text>
  <polygon class="room" points="690,90 985,90 985,315 905,395 690,395"/><text class="lbl" x="830" y="239">216</text>
  <polygon class="room" points="1210,90 1210,190 1170,190 1170,370 1050,370 985,315 985,90"/><text class="lbl" x="1090" y="244">215</text>
  <rect class="room" x="1210" y="90" width="125" height="100"/><text class="lbl" x="1273" y="140">214B</text>
  <rect class="room" x="1195" y="190" width="140" height="95"/><text class="lbl" x="1265" y="238">214A</text>
  <rect class="room" x="1195" y="285" width="140" height="85"/><text class="lbl" x="1265" y="328">213</text>
  <rect class="room" x="1340" y="90" width="270" height="655"/><text class="lbl" x="1475" y="418">214</text>
  <polygon class="room" points="445,330 690,330 690,530 585,530 585,610 355,610 355,480 445,480"/><text class="lbl" x="568" y="442">220</text>
  <rect class="room" x="690" y="395" width="215" height="210"/><text class="lbl" x="798" y="500">200</text>
  <polygon class="room" points="905,395 985,315 1050,370 1335,370 1335,605 905,605"/><text class="lbl" x="1065" y="480">210</text>
  <rect class="room" x="125" y="480" width="230" height="260"/><text class="lbl" x="240" y="610">223</text>
  <rect class="room" x="355" y="610" width="85" height="105"/><text class="lbl" x="398" y="663">201D</text>
  <rect class="room" x="440" y="610" width="145" height="55"/><text class="lblS" x="513" y="638">201A</text>
  <rect class="room" x="440" y="665" width="85" height="75"/><text class="lbl" x="483" y="703">201C</text>
  <rect class="room" x="525" y="665" width="60" height="65"/><text class="lblS" x="555" y="698">201B</text>
  <polygon class="room" points="585,530 690,530 690,640 770,640 770,745 585,745"/><text class="lbl" x="692" y="693">201</text>
  <rect class="room" x="1235" y="610" width="95" height="135"/><text class="lbl" x="1283" y="678">210A</text>
  <rect class="core" x="600" y="755" width="140" height="105"/>
  <g class="icon" transform="translate(639,776) scale(2.625)"><path d="m21 16-3-3h6zm0-8-3 3h6zm-12-8h-6c-1.654 0-3 1.346-3 3v21h9zm11 6.171v-3.171c0-1.654-1.346-3-3-3h-6v24h9v-6.171l-4-4v-3.657l4-4z" fill="#5f6368"/></g>

  <rect class="core" x="910" y="605" width="300" height="140"/>
  <g class="stair"><line x1="919" y1="605" x2="919" y2="745"/><line x1="937" y1="605" x2="937" y2="745"/><line x1="955" y1="605" x2="955" y2="745"/><line x1="973" y1="605" x2="973" y2="745"/><line x1="991" y1="605" x2="991" y2="745"/><line x1="1009" y1="605" x2="1009" y2="745"/><line x1="1027" y1="605" x2="1027" y2="745"/><line x1="1045" y1="605" x2="1045" y2="745"/><line x1="1063" y1="605" x2="1063" y2="745"/><line x1="1081" y1="605" x2="1081" y2="745"/><line x1="1099" y1="605" x2="1099" y2="745"/><line x1="1117" y1="605" x2="1117" y2="745"/><line x1="1135" y1="605" x2="1135" y2="745"/><line x1="1153" y1="605" x2="1153" y2="745"/><line x1="1171" y1="605" x2="1171" y2="745"/><line x1="1189" y1="605" x2="1189" y2="745"/><line x1="1207" y1="605" x2="1207" y2="745"/></g>
  <text class="lbl" x="1060" y="725">ST1</text>
  <polygon class="floor-edge" points="125,75 280,75 280,90 1450,90 1450,70 1610,70 1610,840 1455,840 1455,765 760,765 760,875 585,875 585,765 280,765 280,840 125,840"/>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(440,862) rotate(193)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
