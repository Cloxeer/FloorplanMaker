  <rect class="room" x="1410" y="515" width="220" height="290"/>
  <rect class="room" x="1180" y="570" width="105" height="75"/><text class="lbl" x="1233" y="608">J184</text>
  <rect class="room" x="400" y="590" width="115" height="80"/><text class="lbl" x="458" y="630">W194</text>

  <rect class="core" x="100" y="180" width="65" height="115"/>
  <g class="stair"><line x1="100" y1="189" x2="165" y2="189"/><line x1="100" y1="207" x2="165" y2="207"/><line x1="100" y1="225" x2="165" y2="225"/><line x1="100" y1="243" x2="165" y2="243"/><line x1="100" y1="261" x2="165" y2="261"/><line x1="100" y1="279" x2="165" y2="279"/></g>
  <rect class="core" x="1430" y="240" width="45" height="30"/>
  <g class="stair"><line x1="1439" y1="240" x2="1439" y2="270"/><line x1="1457" y1="240" x2="1457" y2="270"/></g>
  <rect class="core" x="1290" y="550" width="40" height="115"/>
  <g class="stair"><line x1="1290" y1="559" x2="1330" y2="559"/><line x1="1290" y1="577" x2="1330" y2="577"/><line x1="1290" y1="595" x2="1330" y2="595"/><line x1="1290" y1="613" x2="1330" y2="613"/><line x1="1290" y1="631" x2="1330" y2="631"/><line x1="1290" y1="649" x2="1330" y2="649"/></g>
  <polygon class="floor-edge" points="290,65 735,65 735,70 1310,70 1310,120 1410,120 1410,70 1630,70 1630,805 180,805 180,670 175,670 175,590 130,590 130,515 100,515 100,465 165,465 165,450 160,450 160,390 165,390 165,350 105,350 105,295 100,295 100,180 165,180 165,190 290,190"/>
  <line class="door" x1="1274" y1="70" x2="1310" y2="70"/><text class="exit" x="1292" y="125">EXIT</text>
  <line class="door" x1="774" y1="70" x2="810" y2="70"/><text class="exit" x="792" y="125">EXIT</text>
  <line class="door" x1="1630" y1="395" x2="1630" y2="431"/><text class="exit" x="1575" y="413">EXIT</text>
  <line class="door" x1="160" y1="426" x2="160" y2="390"/><text class="exit" x="215" y="408">EXIT</text>
  <line class="door" x1="165" y1="465" x2="165" y2="450"/><text class="exit" x="220" y="458">EXIT</text>
  <line class="door" x1="175" y1="668" x2="175" y2="632"/><text class="exit" x="230" y="650">EXIT</text>
  <line class="door" x1="180" y1="743" x2="180" y2="707"/><text class="exit" x="235" y="725">EXIT</text>
</svg>
