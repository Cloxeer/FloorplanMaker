  <rect class="room" x="290" y="65" width="445" height="325"/><text class="lbl" x="513" y="228">W191</text>
  <rect class="room" x="735" y="180" width="115" height="115"/><text class="lbl" x="793" y="238">W187</text>
  <rect class="room" x="930" y="190" width="205" height="105"/><text class="lbl" x="1033" y="243">W185</text>
  <rect class="room" x="1220" y="450" width="140" height="65"/>
