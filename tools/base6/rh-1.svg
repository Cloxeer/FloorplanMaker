<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2394 1416" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Rentfrow Hall (bldg 211) - FLOOR 1
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="1165,55 1255,55 1255,60 1260,60 1260,855 1925,855 1925,1260 945,1260 945,1270 870,1270 870,1260 735,1260 735,1180 680,1180 680,1080 585,1080 585,810 375,810 375,250 1165,250"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="585" y="770" width="95" height="310"/>
  <rect class="hall" x="870" y="770" width="75" height="410"/>
  <rect class="hall" x="945" y="335" width="90" height="435"/>
  <rect class="hall" x="945" y="1180" width="90" height="80"/>
  <rect class="hall" x="870" y="1180" width="75" height="80"/>
  <rect class="hall" x="1035" y="620" width="15" height="150"/>
  <text class="hall-lbl" transform="rotate(-90 633 923)" x="633" y="923">Hallway</text>
  <text class="hall-lbl" transform="rotate(-90 988 553)" x="988" y="553">Hallway</text>
  <text class="hall-lbl" transform="rotate(-90 908 1013)" x="908" y="1013">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="460,250 585,250 585,335 540,335 540,325 460,325"/><text class="lbl" x="524" y="289">R129</text>
  <polygon class="room" points="585,250 680,250 680,600 630,600 630,405 585,405"/><text class="lbl" x="641" y="397">R130</text>
  <polygon class="room" points="1165,380 1165,490 1050,490 1050,380"/><text class="lbl" x="1108" y="435">R102</text>
  <polygon class="room" points="1050,510 1165,510 1165,620 1050,620"/><text class="lbl" x="1108" y="565">R101</text>
  <polygon class="room" points="1760,1180 1925,1180 1925,1260 1760,1260"/><text class="lbl" x="1843" y="1220">M117</text>
  <polygon class="room" points="735,1180 870,1180 870,1260 735,1260"/><text class="lbl" x="803" y="1220">110</text>
  <polygon class="room" points="1610,1180 1760,1180 1760,1260 1610,1260"/><text class="lbl" x="1685" y="1220">R115</text>
  <rect class="room" x="1165" y="55" width="90" height="110"/><text class="lbl" x="1210" y="110">103</text>
  <rect class="room" x="680" y="250" width="265" height="370"/><text class="lbl" x="813" y="435">100</text>
  <rect class="room" x="945" y="250" width="90" height="85"/>
  <rect class="room" x="1165" y="250" width="90" height="215"/>
  <rect class="room" x="1050" y="325" width="115" height="55"/>
  <rect class="room" x="375" y="600" width="210" height="210"/>
  <rect class="room" x="680" y="770" width="190" height="145"/><text class="lbl" x="775" y="843">105</text>
  <rect class="room" x="945" y="770" width="105" height="205"/><text class="lbl" x="998" y="873">106</text>
  <rect class="room" x="1050" y="855" width="540" height="405"/><text class="lbl" x="1320" y="1058">114</text>
  <rect class="room" x="1590" y="855" width="335" height="325"/><text class="lbl" x="1758" y="1018">119</text>
  <rect class="room" x="680" y="915" width="190" height="165"/><text class="lbl" x="775" y="998">107</text>
  <rect class="room" x="945" y="975" width="105" height="205"/><text class="lbl" x="998" y="1078">108</text>
  <rect class="room" x="680" y="1080" width="190" height="100"/><text class="lbl" x="775" y="1130">109</text>
  <rect class="room" x="1035" y="1180" width="130" height="80"/><text class="lbl" x="1100" y="1220">111</text>
  <rect class="room" x="870" y="1260" width="75" height="10"/><text class="lblS" x="908" y="1265">R110</text>

  <polygon class="floor-edge" points="1165,55 1255,55 1255,60 1260,60 1260,855 1925,855 1925,1260 945,1260 945,1270 870,1270 870,1260 735,1260 735,1180 680,1180 680,1080 585,1080 585,810 375,810 375,250 1165,250"/>
  <line class="door" x1="903" y1="250" x2="939" y2="250"/><text class="exit" x="921" y="305">EXIT</text>
  <line class="door" x1="1071" y1="250" x2="1107" y2="250"/><text class="exit" x="1089" y="305">EXIT</text>
  <line class="door" x1="375" y1="641" x2="375" y2="605"/><text class="exit" x="430" y="623">EXIT</text>
  <line class="door" x1="375" y1="684" x2="375" y2="648"/><text class="exit" x="430" y="666">EXIT</text>
  <line class="door" x1="1889" y1="855" x2="1925" y2="855"/><text class="exit" x="1907" y="910">EXIT</text>
  <line class="door" x1="716" y1="1180" x2="680" y2="1180"/><text class="exit" x="698" y="1125">EXIT</text>
  <line class="door" x1="1019" y1="1260" x2="983" y2="1260"/><text class="exit" x="1001" y="1205">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(2310,1248) rotate(14)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
