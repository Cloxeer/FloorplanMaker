<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1982 980" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Chemistry Building (bldg 187) - FLOOR 3
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="1350,75 1350,220 1780,220 1780,295 1895,295 1895,600 1440,600 1440,700 1365,700 1365,910 135,910 135,580 75,580 75,75"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="335" y="220" width="65" height="150"/>
  <rect class="hall" x="290" y="370" width="160" height="80"/>
  <rect class="hall" x="1715" y="370" width="180" height="60"/>
  <rect class="hall" x="450" y="400" width="900" height="50"/>
  <rect class="hall" x="135" y="875" width="190" height="35"/>
  <rect class="hall" x="400" y="295" width="115" height="75"/>
  <rect class="hall" x="450" y="370" width="65" height="30"/>
  <rect class="hall" x="515" y="370" width="90" height="30"/>
  <rect class="hall" x="555" y="600" width="330" height="60"/>
  <rect class="hall" x="555" y="790" width="330" height="120"/>
  <rect class="hall" x="625" y="450" width="70" height="150"/>
  <rect class="hall" x="810" y="660" width="75" height="130"/>
  <rect class="hall" x="810" y="370" width="505" height="30"/>
  <rect class="hall" x="1255" y="480" width="40" height="220"/>
  <rect class="hall" x="1295" y="450" width="145" height="30"/>
  <rect class="hall" x="1295" y="580" width="70" height="120"/>
  <rect class="hall" x="1365" y="480" width="75" height="100"/>
  <rect class="hall" x="1365" y="580" width="75" height="120"/>
  <rect class="hall" x="325" y="875" width="230" height="35"/>
  <rect class="hall" x="1350" y="385" width="90" height="65"/>
  <rect class="hall" x="1600" y="370" width="20" height="60"/>
  <rect class="hall" x="1620" y="370" width="95" height="80"/>
  <rect class="hall" x="1440" y="370" width="95" height="80"/>
  <rect class="hall" x="1535" y="400" width="65" height="50"/>
  <text class="hall-lbl" x="943" y="423">Hallway</text>
  <text class="hall-lbl" x="718" y="848">Hallway</text>
  <text class="hall-lbl" x="423" y="373">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="325,75 325,115 335,115 335,220 260,220 260,295 210,295 210,220 135,220 135,130 170,130 170,75"/><text class="lbl" x="239" y="165">W350C</text>
  <polygon class="room" points="1235,75 1235,115 1350,115 1350,170 1280,170 1255,220 1315,360 1065,360 1065,75"/><text class="lbl" x="1179" y="219">W364</text>
  <polygon class="room" points="260,220 335,220 335,370 260,370 260,335 290,335 290,295 260,295"/><text class="lbl" x="300" y="293">W3504</text>
  <polygon class="room" points="1620,220 1620,370 1535,370 1535,220"/><text class="lbl" x="1578" y="295">W372</text>
  <polygon class="room" points="1780,220 1780,295 1895,295 1895,360 1715,360 1715,220"/><text class="lbl" x="1788" y="307">W374</text>
  <polygon class="room" points="825,450 825,600 695,600 695,540 715,540 715,480 695,480 695,450"/><text class="lbl" x="764" y="526">W359</text>
  <polygon class="room" points="1715,450 1780,450 1780,600 1715,600"/>
  <polygon class="room" points="1780,450 1895,450 1895,600 1780,600"/>
  <polygon class="room" points="1065,450 1165,450 1165,485 1255,485 1255,600 1065,600"/><text class="lbl" x="1154" y="532">W365</text>
  <polygon class="room" points="885,600 970,600 950,660 1000,660 970,600 1065,600 1040,640 1255,640 1255,875 885,875"/><text class="lbl" x="1064" y="749">W365A</text>
  <rect class="room" x="335" y="170" width="85" height="50"/>
  <rect class="room" x="420" y="220" width="95" height="75"/>
  <rect class="room" x="515" y="220" width="90" height="150"/><text class="lbl" x="560" y="295">W328</text>
  <rect class="room" x="810" y="220" width="160" height="150"/><text class="lbl" x="890" y="295">W362</text>
  <rect class="room" x="1350" y="220" width="90" height="150"/>
  <rect class="room" x="1440" y="220" width="95" height="150"/>
  <rect class="room" x="1620" y="220" width="95" height="150"/>
