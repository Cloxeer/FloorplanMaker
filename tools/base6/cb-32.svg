  <rect class="room" x="885" y="450" width="85" height="150"/>
  <rect class="room" x="970" y="450" width="95" height="150"/><text class="lbl" x="1018" y="525">W363</text>
  <rect class="room" x="1440" y="450" width="95" height="150"/><text class="lbl" x="1488" y="525">W380</text>
  <rect class="room" x="1535" y="450" width="85" height="150"/>
  <rect class="room" x="1620" y="450" width="95" height="150"/>
  <rect class="room" x="135" y="600" width="190" height="275"/><text class="lbl" x="230" y="738">W357A</text>
  <rect class="room" x="555" y="660" width="255" height="130"/><text class="lbl" x="683" y="725">W357</text>
  <rect class="room" x="1255" y="700" width="95" height="210"/>

  <rect class="core" x="1315" y="360" width="35" height="25"/>
  <g class="stair"><line x1="1324" y1="360" x2="1324" y2="385"/><line x1="1342" y1="360" x2="1342" y2="385"/></g>
  <rect class="core" x="1295" y="480" width="70" height="100"/>
  <g class="stair"><line x1="1304" y1="480" x2="1304" y2="580"/><line x1="1322" y1="480" x2="1322" y2="580"/><line x1="1340" y1="480" x2="1340" y2="580"/><line x1="1358" y1="480" x2="1358" y2="580"/></g>
  <polygon class="floor-edge" points="1350,75 1350,220 1780,220 1780,295 1895,295 1895,600 1440,600 1440,700 1365,700 1365,910 135,910 135,580 75,580 75,75"/>
  <line class="door" x1="344" y1="75" x2="380" y2="75"/><text class="exit" x="362" y="130">EXIT</text>
  <line class="door" x1="135" y1="863" x2="135" y2="827"/><text class="exit" x="190" y="845">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(1732,106) rotate(9)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
