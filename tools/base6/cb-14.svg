<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1161 809" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Chemistry Building (bldg 187) - FLOOR 1
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="475,35 1065,35 1065,285 1055,285 1055,300 905,300 905,315 870,315 870,335 855,335 855,420 775,420 775,460 645,460 645,445 430,445 430,465 315,465 315,565 440,565 440,730 430,730 430,765 320,765 320,715 75,715 75,470 165,470 165,415 355,415 355,290 440,290 440,235 540,235 540,290 645,290 645,95 475,95"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="355" y="315" width="500" height="100"/>
  <rect class="hall" x="645" y="415" width="130" height="45"/>
  <rect class="hall" x="165" y="420" width="265" height="40"/>
  <rect class="hall" x="355" y="415" width="75" height="5"/>
  <rect class="hall" x="688" y="395" width="55" height="10"/>
  <text class="hall-lbl" x="653" y="363">Hallway</text>
  <text class="hall-lbl" x="448" y="388">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="475,35 580,35 580,95 475,95"/><text class="lblS" x="528" y="65">W157</text>
  <polygon class="room" points="440,235 540,235 540,285 440,285"/><text class="lblS" x="490" y="260">W159</text>
  <polygon class="room" points="320,565 430,565 430,605 320,605"/><text class="lblS" x="375" y="585">M161</text>
  <polygon class="room" points="75,470 125,470 125,510 165,510 165,715 75,715"/><text class="lbl" x="118" y="601">R161A</text>
  <polygon class="room" points="255,470 315,470 315,715 215,715 215,510 255,510"/><text class="lbl" x="267" y="600">R161B</text>
  <polygon class="room" points="320,605 355,605 355,620 430,620 430,730 355,730 355,765 320,765"/><text class="lbl" x="370" y="679">W115</text>
  <rect class="room" x="645" y="35" width="410" height="255"/><text class="lbl" x="850" y="163">W156</text>

  <polygon class="floor-edge" points="475,35 1065,35 1065,285 1055,285 1055,300 905,300 905,315 870,315 870,335 855,335 855,420 775,420 775,460 645,460 645,445 430,445 430,465 315,465 315,565 440,565 440,730 430,730 430,765 320,765 320,715 75,715 75,470 165,470 165,415 355,415 355,290 440,290 440,235 540,235 540,290 645,290 645,95 475,95"/>
  <line class="door" x1="511" y1="95" x2="475" y2="95"/><text class="exit" x="493" y="40">EXIT</text>
  <line class="door" x1="440" y1="271" x2="440" y2="235"/><text class="exit" x="495" y="253">EXIT</text>
  <line class="door" x1="404" y1="290" x2="440" y2="290"/><text class="exit" x="422" y="345">EXIT</text>
  <line class="door" x1="999" y1="300" x2="963" y2="300"/><text class="exit" x="981" y="245">EXIT</text>
  <line class="door" x1="905" y1="315" x2="870" y2="315"/><text class="exit" x="888" y="260">EXIT</text>
  <line class="door" x1="174" y1="415" x2="210" y2="415"/><text class="exit" x="192" y="470">EXIT</text>
  <line class="door" x1="92" y1="470" x2="128" y2="470"/><text class="exit" x="110" y="525">EXIT</text>
  <line class="door" x1="427" y1="765" x2="391" y2="765"/><text class="exit" x="409" y="710">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(152,132) rotate(283)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
