<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1363 975" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Chemistry Building (bldg 187) - FLOOR 3
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="495,5 530,5 530,40 1360,40 1360,970 530,970 530,615 515,615 515,945 380,945 380,730 155,730 155,40 495,40"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="420" y="540" width="605" height="75"/>
  <rect class="hall" x="440" y="615" width="75" height="115"/>
  <rect class="hall" x="530" y="725" width="495" height="25"/>
  <rect class="hall" x="380" y="730" width="60" height="25"/>
  <rect class="hall" x="530" y="730" width="65" height="115"/>
  <rect class="hall" x="530" y="845" width="65" height="125"/>
  <rect class="hall" x="595" y="945" width="140" height="25"/>
  <rect class="hall" x="440" y="730" width="90" height="20"/>
  <text class="hall-lbl" x="733" y="573">Hallway</text>
  <text class="hall-lbl" transform="rotate(-90 563 848)" x="563" y="848">Hallway</text>
  <text class="hall-lbl" transform="rotate(-90 478 638)" x="478" y="638">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="155,615 250,615 250,730 155,730"/><text class="lbl" x="203" y="673">334</text>
  <polygon class="room" points="830,615 915,615 915,725 830,725"/><text class="lbl" x="873" y="670">340</text>
  <polygon class="room" points="725,615 815,615 815,725 720,725 720,645 725,645"/><text class="lbl" x="768" y="671">R339</text>
  <polygon class="room" points="1315,825 1360,825 1360,890 1315,890"/>
  <polygon class="room" points="1315,890 1360,890 1360,970 1315,970"/>
  <polygon class="room" points="380,540 440,540 440,555 420,555 420,615 380,615"/>
  <rect class="room" x="380" y="250" width="150" height="290"/><text class="lbl" x="455" y="395">329</text>
  <rect class="room" x="735" y="250" width="180" height="290"/><text class="lbl" x="825" y="395">327</text>
  <rect class="room" x="915" y="250" width="400" height="290"/><text class="lbl" x="1115" y="395">325</text>
  <rect class="room" x="640" y="350" width="95" height="190"/><text class="lbl" x="688" y="445">328</text>
  <rect class="room" x="535" y="610" width="85" height="115"/><text class="lbl" x="578" y="668">338</text>
  <rect class="room" x="250" y="615" width="130" height="115"/><text class="lbl" x="315" y="673">335</text>
  <rect class="room" x="380" y="615" width="60" height="115"/><text class="lblS" x="410" y="673">336</text>
  <rect class="room" x="620" y="615" width="105" height="110"/>
  <rect class="room" x="920" y="615" width="100" height="110"/><text class="lbl" x="970" y="670">341</text>
  <rect class="room" x="600" y="750" width="130" height="95"/><text class="lbl" x="665" y="798">W376</text>
  <rect class="room" x="380" y="755" width="135" height="190"/><text class="lbl" x="448" y="850">W374</text>
  <rect class="room" x="595" y="845" width="130" height="100"/><text class="lbl" x="660" y="895">W377</text>
  <rect class="core" x="1025" y="670" width="80" height="60"/>
  <g class="icon" transform="translate(1047,682) scale(1.5)"><path d="m21 16-3-3h6zm0-8-3 3h6zm-12-8h-6c-1.654 0-3 1.346-3 3v21h9zm11 6.171v-3.171c0-1.654-1.346-3-3-3h-6v24h9v-6.171l-4-4v-3.657l4-4z" fill="#5f6368"/></g>

  <rect class="core" x="495" y="5" width="35" height="35"/>
  <g class="stair"><line x1="495" y1="14" x2="530" y2="14"/><line x1="495" y1="32" x2="530" y2="32"/></g>
  <rect class="core" x="380" y="85" width="215" height="30"/>
  <g class="stair"><line x1="380" y1="94" x2="595" y2="94"/><line x1="380" y1="112" x2="595" y2="112"/></g>
  <polygon class="floor-edge" points="495,5 530,5 530,40 1360,40 1360,970 530,970 530,615 515,615 515,945 380,945 380,730 155,730 155,40 495,40"/>
  <line class="door" x1="155" y1="697" x2="155" y2="661"/><text class="exit" x="210" y="679">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(117,858) rotate(283)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
