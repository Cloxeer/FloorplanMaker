<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1774 1496" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Biology Annex (bldg 82) - FLOOR 1
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="1675,130 1695,130 1695,150 1775,150 1775,1075 1790,1075 1790,1170 880,1170 880,1280 295,1280 295,1030 85,1030 85,415 55,415 55,195 1660,195 1660,140 1675,140"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="570" y="635" width="780" height="85"/>
  <rect class="hall" x="920" y="305" width="70" height="865"/>
  <rect class="hall" x="1295" y="720" width="55" height="255"/>
  <rect class="hall" x="880" y="975" width="40" height="195"/>
  <text class="hall-lbl" transform="rotate(-90 953 738)" x="953" y="738">Hallway</text>
  <text class="hall-lbl" x="1208" y="678">Hallway</text>
  <text class="hall-lbl" transform="rotate(-90 953 463)" x="953" y="463">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="340,720 615,720 615,760 690,760 690,975 295,975 295,760 340,760"/><text class="lbl" x="491" y="853">113</text>
  <polygon class="room" points="690,890 820,890 820,975 690,975"/><text class="lbl" x="755" y="933">103A</text>
  <polygon class="room" points="470,975 880,975 880,1075 615,1075 615,1280 470,1280"/><text class="lbl" x="619" y="1089">103</text>
  <polygon class="room" points="1120,775 1140,775 1140,975 1085,975 1085,930 1035,930 1035,975 990,975 990,890 1120,890"/><text class="lbl" x="1078" y="911">R100B</text>
  <rect class="room" x="880" y="195" width="155" height="110"/><text class="lbl" x="958" y="250">111A</text>
  <rect class="room" x="55" y="305" width="95" height="110"/><text class="lbl" x="103" y="360">110</text>
  <rect class="room" x="470" y="360" width="100" height="55"/><text class="lblS" x="520" y="388">105</text>
  <rect class="room" x="1350" y="415" width="95" height="80"/><text class="lbl" x="1398" y="455">104</text>
  <rect class="room" x="1350" y="620" width="120" height="85"/><text class="lbl" x="1410" y="663">102A</text>
  <rect class="room" x="690" y="705" width="130" height="185"/><text class="lbl" x="755" y="798">103F</text>
  <rect class="room" x="820" y="795" width="100" height="180"/><text class="lbl" x="870" y="885">112</text>
  <rect class="room" x="990" y="825" width="130" height="65"/><text class="lblS" x="1055" y="858">100</text>
  <rect class="room" x="85" y="975" width="110" height="55"/><text class="lblS" x="140" y="1003">114</text>
  <rect class="room" x="295" y="975" width="175" height="160"/><text class="lbl" x="383" y="1055">103C</text>
  <rect class="room" x="1295" y="975" width="95" height="55"/><text class="lblS" x="1343" y="1003">102</text>
  <rect class="room" x="1675" y="1075" width="115" height="95"/><text class="lbl" x="1733" y="1123">106</text>
  <rect class="room" x="295" y="1135" width="175" height="145"/><text class="lbl" x="383" y="1208">103B</text>

  <rect class="core" x="1660" y="140" width="35" height="55"/>
  <g class="stair"><line x1="1669" y1="140" x2="1669" y2="195"/><line x1="1687" y1="140" x2="1687" y2="195"/></g>
  <rect class="core" x="1745" y="150" width="30" height="70"/>
  <g class="stair"><line x1="1745" y1="159" x2="1775" y2="159"/><line x1="1745" y1="177" x2="1775" y2="177"/><line x1="1745" y1="195" x2="1775" y2="195"/><line x1="1745" y1="213" x2="1775" y2="213"/></g>
  <polygon class="floor-edge" points="1675,130 1695,130 1695,150 1775,150 1775,1075 1790,1075 1790,1170 880,1170 880,1280 295,1280 295,1030 85,1030 85,415 55,415 55,195 1660,195 1660,140 1675,140"/>
  <line class="door" x1="85" y1="700" x2="85" y2="664"/><text class="exit" x="140" y="682">EXIT</text>
  <line class="door" x1="880" y1="1244" x2="880" y2="1280"/><text class="exit" x="825" y="1262">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(132,1320) rotate(192)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
