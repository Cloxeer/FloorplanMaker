<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1365" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    HJLC (bldg 1) - FLOOR 1
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="960,90 1105,90 1105,245 1100,245 1100,250 970,250 970,415 1035,415 1035,500 950,500 950,675 730,675 730,1005 615,1005 615,675 380,675 380,720 315,720 315,930 210,930 210,760 125,760 125,750 70,750 70,695 65,695 65,485 70,485 70,95 960,95"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="505" y="250" width="60" height="235"/>
  <rect class="hall" x="125" y="500" width="775" height="175"/>
  <rect class="hall" x="615" y="675" width="115" height="255"/>
  <rect class="hall" x="615" y="655" width="115" height="10"/>
  <rect class="hall" x="505" y="485" width="60" height="15"/>
  <text class="hall-lbl" x="513" y="588">Hallway</text>
  <text class="hall-lbl" x="263" y="588">Hallway</text>
  <text class="hall-lbl" x="763" y="588">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="210,95 210,485 125,485 125,250 70,250 70,95"/><text class="lbl" x="153" y="266">128</text>
  <polygon class="room" points="950,150 950,250 860,250 860,150"/><text class="lbl" x="905" y="200">128N</text>
  <polygon class="room" points="950,250 950,310 900,310 900,325 950,325 950,380 860,380 860,250"/><text class="lbl" x="904" y="315">121</text>
  <polygon class="room" points="950,380 950,485 860,485 860,380"/><text class="lbl" x="905" y="433">128P</text>
  <polygon class="room" points="65,485 125,485 125,695 65,695"/><text class="lblS" x="95" y="590">171</text>
  <polygon class="room" points="125,675 210,675 210,760 125,760 160,720 210,720 160,695 125,720"/>
  <polygon class="room" points="380,675 380,720 315,855 315,930 210,930 210,675"/><text class="lbl" x="279" y="789">M127</text>
  <rect class="room" x="960" y="90" width="145" height="155"/>
  <rect class="room" x="210" y="195" width="650" height="290"/><text class="lbl" x="535" y="340">128R</text>
  <rect class="room" x="565" y="340" width="105" height="145"/><text class="lbl" x="618" y="413">128Q</text>
  <rect class="room" x="615" y="930" width="115" height="75"/><text class="lbl" x="673" y="968">195</text>

  <rect class="core" x="900" y="500" width="50" height="70"/>
  <g class="stair"><line x1="909" y1="500" x2="909" y2="570"/><line x1="927" y1="500" x2="927" y2="570"/><line x1="945" y1="500" x2="945" y2="570"/></g>
  <polygon class="floor-edge" points="960,90 1105,90 1105,245 1100,245 1100,250 970,250 970,415 1035,415 1035,500 950,500 950,675 730,675 730,1005 615,1005 615,675 380,675 380,720 315,720 315,930 210,930 210,760 125,760 125,750 70,750 70,695 65,695 65,485 70,485 70,95 960,95"/>
  <line class="door" x1="119" y1="750" x2="83" y2="750"/><text class="exit" x="101" y="695">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(682,75) rotate(272)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
