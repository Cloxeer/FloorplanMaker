<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1728 944" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Hadley Hall (bldg 172) - FLOOR 2
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="1450,70 1610,70 1610,745 1450,745 1450,760 755,760 755,875 585,875 585,765 370,765 370,855 275,855 275,840 125,840 125,90 1450,90"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="440" y="330" width="90" height="280"/>
  <rect class="hall" x="370" y="540" width="730" height="70"/>
  <rect class="hall" x="585" y="610" width="170" height="30"/>
  <rect class="hall" x="1260" y="370" width="70" height="240"/>
  <rect class="hall" x="1035" y="500" width="225" height="40"/>
  <rect class="hall" x="1100" y="540" width="160" height="70"/>
  <rect class="hall" x="1210" y="610" width="25" height="150"/>
  <rect class="hall" x="720" y="640" width="35" height="120"/>
  <rect class="hall" x="370" y="700" width="70" height="65"/>
  <rect class="hall" x="585" y="700" width="135" height="65"/>
  <rect class="hall" x="530" y="745" width="55" height="20"/>
  <rect class="hall" x="125" y="745" width="245" height="20"/>
  <rect class="hall" x="440" y="745" width="90" height="20"/>
  <text class="hall-lbl" x="848" y="573">Hallway</text>
  <text class="hall-lbl" x="1183" y="553">Hallway</text>
  <text class="hall-lbl" x="553" y="573">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="1210,90 1210,190 1170,190 1170,370 1050,370 985,310 985,90"/><text class="lbl" x="1088" y="219">215</text>
  <polygon class="room" points="585,610 585,670 440,670 440,610"/><text class="lblS" x="513" y="640">201A</text>
  <polygon class="room" points="585,670 585,700 530,700 530,670"/><text class="lblS" x="558" y="685">201B</text>
  <polygon class="room" points="275,765 370,765 370,855 275,855"/>
  <polygon class="room" points="630,765 700,765 700,840 630,840"/>
  <rect class="room" x="125" y="90" width="315" height="390"/><text class="lbl" x="283" y="285">222</text>
  <rect class="room" x="440" y="90" width="245" height="240"/><text class="lbl" x="563" y="210">221</text>
  <rect class="room" x="1210" y="90" width="120" height="100"/><text class="lbl" x="1270" y="140">214B</text>
  <rect class="room" x="1330" y="90" width="280" height="655"/><text class="lbl" x="1470" y="418">214</text>
  <rect class="room" x="1195" y="190" width="135" height="95"/><text class="lbl" x="1263" y="238">214A</text>
  <rect class="room" x="530" y="220" width="330" height="320"/><text class="lbl" x="695" y="380">216</text>
  <rect class="room" x="1195" y="285" width="135" height="85"/><text class="lbl" x="1263" y="328">213</text>
  <rect class="room" x="1035" y="370" width="225" height="130"/><text class="lbl" x="1148" y="435">210</text>
  <rect class="room" x="125" y="480" width="245" height="265"/><text class="lbl" x="248" y="613">223</text>
  <rect class="room" x="370" y="610" width="70" height="90"/><text class="lbl" x="405" y="655">201D</text>
  <rect class="room" x="1100" y="610" width="110" height="135"/><text class="lbl" x="1155" y="678">211</text>
  <rect class="room" x="1235" y="610" width="95" height="135"/><text class="lbl" x="1283" y="678">210A</text>
  <rect class="room" x="585" y="640" width="135" height="60"/>
  <rect class="room" x="440" y="670" width="90" height="75"/><text class="lbl" x="485" y="708">201C</text>
  <rect class="room" x="530" y="700" width="55" height="45"/><text class="lblS" x="558" y="723">201</text>

  <rect class="core" x="420" y="90" width="30" height="100"/>
  <g class="stair"><line x1="429" y1="90" x2="429" y2="190"/><line x1="447" y1="90" x2="447" y2="190"/></g>
  <rect class="core" x="910" y="715" width="200" height="30"/>
  <g class="stair"><line x1="919" y1="715" x2="919" y2="745"/><line x1="937" y1="715" x2="937" y2="745"/><line x1="955" y1="715" x2="955" y2="745"/><line x1="973" y1="715" x2="973" y2="745"/><line x1="991" y1="715" x2="991" y2="745"/><line x1="1009" y1="715" x2="1009" y2="745"/><line x1="1027" y1="715" x2="1027" y2="745"/><line x1="1045" y1="715" x2="1045" y2="745"/><line x1="1063" y1="715" x2="1063" y2="745"/><line x1="1081" y1="715" x2="1081" y2="745"/><line x1="1099" y1="715" x2="1099" y2="745"/></g>
  <polygon class="floor-edge" points="1450,70 1610,70 1610,745 1450,745 1450,760 755,760 755,875 585,875 585,765 370,765 370,855 275,855 275,840 125,840 125,90 1450,90"/>
  <line class="door" x1="1011" y1="760" x2="975" y2="760"/><text class="exit" x="993" y="705">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(284,869) rotate(193)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
