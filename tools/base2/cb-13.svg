<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 870" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Chemistry Building (bldg 187) - FLOOR 13
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="1650,55 1745,55 1745,805 225,805 225,670 220,670 220,585 215,585 215,590 130,590 130,585 125,585 125,465 130,465 130,460 215,460 215,350 120,350 120,250 0,250 0,200 120,200 120,105 215,105 215,190 335,190 335,65 1355,65 1355,120 1460,120 1460,70 1650,70"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="1355" y="120" width="105" height="285"/>
  <rect class="hall" x="335" y="385" width="455" height="75"/>
  <rect class="hall" x="815" y="250" width="60" height="155"/>
  <rect class="hall" x="790" y="385" width="240" height="75"/>
  <rect class="hall" x="980" y="250" width="200" height="100"/>
  <rect class="hall" x="1030" y="385" width="230" height="75"/>
  <rect class="hall" x="1410" y="460" width="335" height="5"/>
  <rect class="hall" x="1460" y="270" width="45" height="150"/>
  <rect class="hall" x="1585" y="350" width="160" height="110"/>
  <rect class="hall" x="1460" y="405" width="45" height="55"/>
  <rect class="hall" x="875" y="310" width="105" height="40"/>
  <rect class="hall" x="1180" y="310" width="175" height="40"/>
  <rect class="hall" x="1320" y="465" width="140" height="80"/>
  <rect class="hall" x="1380" y="545" width="80" height="260"/>
  <text class="hall-lbl" x="798" y="423">Hallway</text>
  <text class="hall-lbl" transform="rotate(-90 1408 268)" x="1408" y="268">Hallway</text>
  <text class="hall-lbl" x="508" y="423">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="0,200 20,200 20,215 30,215 30,250 0,250"/>
  <polygon class="room" points="1565,190 1650,190 1650,350 1565,350"/><text class="lbl" x="1608" y="270">R183A</text>
  <polygon class="room" points="225,460 335,460 335,505 450,505 450,670 220,670 220,505 225,505"/><text class="lbl" x="329" y="575">W192</text>
  <polygon class="room" points="130,460 215,460 215,590 180,590 180,585 130,585"/><text class="lbl" x="173" y="524">W196</text>
  <polygon class="room" points="450,460 565,460 565,585 450,585"/><text class="lbl" x="508" y="523">W193</text>
  <polygon class="room" points="335,670 565,670 565,805 270,805 335,740 270,740 270,720 335,720"/><text class="lbl" x="436" y="740">W195</text>
  <polygon class="room" points="1505,350 1585,350 1585,460 1540,460 1540,405 1505,405"/>
  <rect class="room" x="335" y="65" width="455" height="320"/><text class="lbl" x="563" y="225">W191</text>
  <rect class="room" x="790" y="190" width="105" height="60"/><text class="lblS" x="843" y="220">W187</text>
  <rect class="room" x="980" y="190" width="200" height="60"/><text class="lblS" x="1080" y="220">W185</text>
  <rect class="room" x="565" y="460" width="225" height="345"/><text class="lbl" x="678" y="633">W190</text>
  <rect class="room" x="790" y="460" width="215" height="345"/><text class="lbl" x="898" y="633">W188</text>
  <rect class="room" x="1005" y="460" width="220" height="345"/><text class="lbl" x="1115" y="633">W186</text>
  <rect class="room" x="1260" y="460" width="150" height="5"/>
  <rect class="room" x="1460" y="465" width="190" height="340"/>
  <rect class="room" x="1225" y="555" width="105" height="90"/><text class="lbl" x="1278" y="600">J184</text>
  <rect class="room" x="450" y="585" width="115" height="85"/><text class="lbl" x="508" y="628">W194</text>

  <rect class="core" x="130" y="190" width="85" height="100"/>
  <g class="stair"><line x1="130" y1="199" x2="215" y2="199"/><line x1="130" y1="217" x2="215" y2="217"/><line x1="130" y1="235" x2="215" y2="235"/><line x1="130" y1="253" x2="215" y2="253"/><line x1="130" y1="271" x2="215" y2="271"/><line x1="130" y1="289" x2="215" y2="289"/></g>
  <rect class="core" x="1460" y="240" width="60" height="30"/>
  <g class="stair"><line x1="1469" y1="240" x2="1469" y2="270"/><line x1="1487" y1="240" x2="1487" y2="270"/><line x1="1505" y1="240" x2="1505" y2="270"/></g>
  <rect class="core" x="1340" y="545" width="40" height="115"/>
  <g class="stair"><line x1="1340" y1="554" x2="1380" y2="554"/><line x1="1340" y1="572" x2="1380" y2="572"/><line x1="1340" y1="590" x2="1380" y2="590"/><line x1="1340" y1="608" x2="1380" y2="608"/><line x1="1340" y1="626" x2="1380" y2="626"/><line x1="1340" y1="644" x2="1380" y2="644"/></g>
  <polygon class="floor-edge" points="1650,55 1745,55 1745,805 225,805 225,670 220,670 220,585 215,585 215,590 130,590 130,585 125,585 125,465 130,465 130,460 215,460 215,350 120,350 120,250 0,250 0,200 120,200 120,105 215,105 215,190 335,190 335,65 1355,65 1355,120 1460,120 1460,70 1650,70"/>
  <line class="door" x1="1319" y1="65" x2="1355" y2="65"/><text class="exit" x="1337" y="120">EXIT</text>
  <line class="door" x1="822" y1="65" x2="858" y2="65"/><text class="exit" x="840" y="120">EXIT</text>
  <line class="door" x1="176" y1="350" x2="140" y2="350"/><text class="exit" x="158" y="295">EXIT</text>
  <line class="door" x1="1745" y1="393" x2="1745" y2="429"/><text class="exit" x="1690" y="411">EXIT</text>
  <line class="door" x1="215" y1="455" x2="215" y2="419"/><text class="exit" x="270" y="437">EXIT</text>
  <line class="door" x1="220" y1="666" x2="220" y2="630"/><text class="exit" x="275" y="648">EXIT</text>
  <line class="door" x1="225" y1="741" x2="225" y2="705"/><text class="exit" x="280" y="723">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(152,821) rotate(190)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
