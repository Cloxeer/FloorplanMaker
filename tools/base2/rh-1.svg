<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1926 1386" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Rentfrow Hall (bldg 211) - FLOOR 1
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="215,730 1495,730 1495,825 1540,825 1540,860 1545,860 1545,880 1555,880 1555,1285 680,1285 680,1245 670,1245 670,1235 570,1235 570,1245 565,1245 565,1250 570,1250 570,1255 565,1255 565,1285 370,1285 370,1160 305,1160 305,1120 215,1120"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="215" y="730" width="90" height="390"/>
  <rect class="hall" x="485" y="730" width="85" height="515"/>
  <rect class="hall" x="680" y="765" width="730" height="60"/>
  <text class="hall-lbl" transform="rotate(-90 258 908)" x="258" y="908">Hallway</text>
  <text class="hall-lbl" transform="rotate(-90 533 988)" x="533" y="988">Hallway</text>
  <text class="hall-lbl" x="1043" y="793">Hallway</text>
  <text class="hall-lbl" x="803" y="793">Hallway</text>
  <text class="hall-lbl" x="1283" y="793">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="1385,1160 1555,1160 1555,1245 1385,1245"/><text class="lbl" x="1470" y="1203">M117</text>
  <polygon class="room" points="670,1160 765,1160 765,1245 670,1245"/><text class="lbl" x="718" y="1203">111</text>
  <polygon class="room" points="370,1160 485,1160 485,1245 370,1245"/><text class="lbl" x="428" y="1203">110</text>
  <polygon class="room" points="1235,1160 1385,1160 1385,1250 1235,1250"/><text class="lbl" x="1310" y="1205">R115</text>
  <rect class="room" x="305" y="730" width="195" height="150"/><text class="lbl" x="403" y="805">105</text>
  <rect class="room" x="570" y="730" width="110" height="220"/><text class="lbl" x="625" y="840">106</text>
  <rect class="room" x="680" y="825" width="535" height="420"/><text class="lbl" x="948" y="1035">114</text>
  <rect class="room" x="1215" y="825" width="325" height="335"/><text class="lbl" x="1378" y="993">119</text>
  <rect class="room" x="305" y="880" width="195" height="140"/><text class="lbl" x="403" y="950">107</text>
  <rect class="room" x="570" y="950" width="110" height="210"/><text class="lbl" x="625" y="1055">108</text>
  <rect class="room" x="305" y="1020" width="195" height="140"/><text class="lbl" x="403" y="1090">109</text>
  <rect class="room" x="485" y="1250" width="85" height="5"/>

  <polygon class="floor-edge" points="215,730 1495,730 1495,825 1540,825 1540,860 1545,860 1545,880 1555,880 1555,1285 680,1285 680,1245 670,1245 670,1235 570,1235 570,1245 565,1245 565,1250 570,1250 570,1255 565,1255 565,1285 370,1285 370,1160 305,1160 305,1120 215,1120"/>
  <line class="door" x1="1504" y1="825" x2="1540" y2="825"/><text class="exit" x="1522" y="880">EXIT</text>
  <line class="door" x1="341" y1="1160" x2="305" y2="1160"/><text class="exit" x="323" y="1105">EXIT</text>
  <line class="door" x1="644" y1="1235" x2="608" y2="1235"/><text class="exit" x="626" y="1180">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(1803,747) rotate(70)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
