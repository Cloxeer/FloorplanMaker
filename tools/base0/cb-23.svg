<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1832 854" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Chemistry Building (bldg 187) - FLOOR 23
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="265,65 1265,65 1265,230 1310,230 1310,220 1785,220 1785,230 1830,230 1830,625 1785,625 1785,630 1340,630 1340,725 1265,725 1265,790 290,790 290,780 175,780 175,655 115,655 115,570 100,570 100,655 175,655 175,710 0,710 0,265 50,265 50,365 265,365"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="290" y="220" width="55" height="145"/>
  <rect class="hall" x="115" y="365" width="295" height="65"/>
  <rect class="hall" x="0" y="265" width="50" height="305"/>
  <rect class="hall" x="50" y="365" width="50" height="205"/>
  <rect class="hall" x="50" y="570" width="50" height="140"/>
  <rect class="hall" x="100" y="365" width="15" height="100"/>
  <rect class="hall" x="115" y="430" width="255" height="35"/>
  <rect class="hall" x="345" y="230" width="100" height="135"/>
  <rect class="hall" x="445" y="265" width="45" height="100"/>
  <rect class="hall" x="490" y="325" width="325" height="40"/>
  <rect class="hall" x="490" y="365" width="325" height="100"/>
  <rect class="hall" x="815" y="365" width="175" height="100"/>
  <rect class="hall" x="990" y="365" width="30" height="100"/>
  <rect class="hall" x="720" y="465" width="95" height="40"/>
  <text class="hall-lbl" x="753" y="413">Hallway</text>
  <text class="hall-lbl" x="183" y="413">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="1165,65 1265,65 1265,365 1165,365"/>
  <polygon class="room" points="1265,230 1340,230 1340,365 1265,365"/>
  <polygon class="room" points="1565,230 1645,230 1645,365 1565,365"/>
  <polygon class="room" points="1480,230 1565,230 1565,365 1455,365 1455,325 1480,325"/>
  <polygon class="room" points="1685,465 1685,625 1600,625 1600,465"/>
  <polygon class="room" points="225,465 290,465 290,655 175,655 175,505 225,505"/>
  <polygon class="room" points="470,465 545,465 545,780 470,780 470,725 445,725 445,780 345,780 345,505 470,505"/><text class="lbl" x="448" y="631">W217</text>
  <polygon class="room" points="645,465 720,465 720,780 645,780 645,725 625,725 625,780 545,780 545,505 645,505"/><text class="lbl" x="635" y="631">W273</text>
  <polygon class="room" points="720,505 765,505 765,570 815,570 815,780 720,780"/>
  <polygon class="room" points="50,655 50,710 0,710 0,655"/>
  <polygon class="room" points="290,465 370,465 370,505 345,505 345,780 290,780 290,725 175,725 175,655 290,655"/><text class="lbl" x="293" y="638">W275</text>
  <polygon class="room" points="425,365 490,365 490,430 470,430 470,465 445,465 445,505 370,505 370,430 425,430"/>
  <polygon class="room" points="1310,365 1310,465 1215,465 1215,505 1165,505 1165,430 1150,430 1150,505 1080,505 1080,465 1020,465 1020,365"/>
  <polygon class="room" points="1750,220 1785,220 1785,630 1750,630 1750,625 1685,625 1685,465 1310,465 1310,365 1340,365 1340,325 1455,325 1455,365 1750,365"/><text class="lbl" x="1595" y="431">W232</text>
  <rect class="room" x="815" y="65" width="175" height="300"/><text class="lbl" x="903" y="215">W280</text>
  <rect class="room" x="990" y="65" width="175" height="300"/>
  <rect class="room" x="445" y="230" width="320" height="35"/><text class="lblS" x="605" y="248">W278</text>
  <rect class="room" x="1340" y="230" width="140" height="95"/>
  <rect class="room" x="1645" y="230" width="105" height="135"/><text class="lbl" x="1698" y="298">W230</text>
  <rect class="room" x="100" y="465" width="75" height="190"/><text class="lbl" x="138" y="560">R275A</text>
  <rect class="room" x="815" y="465" width="175" height="315"/>
  <rect class="room" x="990" y="465" width="175" height="315"/>
  <rect class="room" x="1340" y="465" width="85" height="160"/>
  <rect class="room" x="1425" y="465" width="90" height="160"/><text class="lbl" x="1470" y="545">W295</text>
  <rect class="room" x="1515" y="465" width="85" height="160"/>
  <rect class="room" x="0" y="570" width="50" height="85"/>

  <rect class="core" x="1240" y="470" width="30" height="115"/>
  <g class="stair"><line x1="1249" y1="470" x2="1249" y2="585"/><line x1="1267" y1="470" x2="1267" y2="585"/></g>
  <polygon class="floor-edge" points="265,65 1265,65 1265,230 1310,230 1310,220 1785,220 1785,230 1830,230 1830,625 1785,625 1785,630 1340,630 1340,725 1265,725 1265,790 290,790 290,780 175,780 175,655 115,655 115,570 100,570 100,655 175,655 175,710 0,710 0,265 50,265 50,365 265,365"/>
  <line class="door" x1="265" y1="294" x2="265" y2="258"/><text class="exit" x="320" y="276">EXIT</text>
  <line class="door" x1="1376" y1="630" x2="1340" y2="630"/><text class="exit" x="1358" y="575">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(1618,60) rotate(11)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
