<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2014 954" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Chemistry Building (bldg 187) - FLOOR 2
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="270,75 1380,75 1380,250 2000,250 2000,700 1465,700 1465,815 1380,815 1380,885 270,885 270,870 165,870 165,640 125,640 125,575 130,575 130,520 110,520 110,405 270,405"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="270" y="250" width="85" height="190"/>
  <rect class="hall" x="110" y="440" width="330" height="80"/>
  <rect class="hall" x="490" y="440" width="385" height="80"/>
  <rect class="hall" x="1565" y="440" width="255" height="80"/>
  <rect class="hall" x="355" y="250" width="105" height="190"/>
  <rect class="hall" x="460" y="315" width="305" height="125"/>
  <rect class="hall" x="875" y="440" width="195" height="80"/>
  <rect class="hall" x="1070" y="440" width="35" height="80"/>
  <text class="hall-lbl" x="518" y="383">Hallway</text>
  <text class="hall-lbl" x="868" y="483">Hallway</text>
  <text class="hall-lbl" transform="rotate(-90 693 418)" x="693" y="418">Hallway</text>
  <text class="hall-lbl" x="1693" y="478">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="1270,75 1380,75 1380,440 1270,440"/><text class="lbl" x="1325" y="258">W284</text>
  <polygon class="room" points="1380,250 1465,250 1465,405 1380,405"/><text class="lbl" x="1423" y="328">R287</text>
  <polygon class="room" points="1725,250 1820,250 1820,405 1725,405"/><text class="lbl" x="1773" y="328">229</text>
  <polygon class="room" points="1630,250 1725,250 1725,405 1600,405 1600,355 1630,355"/>
  <polygon class="room" points="1765,520 1865,520 1865,700 1765,700"/><text class="lbl" x="1815" y="610">293</text>
  <polygon class="room" points="1865,520 1935,520 1935,700 1865,700"/><text class="lbl" x="1900" y="610">292</text>
  <polygon class="room" points="225,520 270,520 270,700 200,700 200,575 225,575"/><text class="lbl" x="238" y="618">R275B</text>
  <polygon class="room" points="490,520 570,520 570,870 490,870 490,815 460,815 460,870 355,870 355,575 490,575"/><text class="lbl" x="467" y="708">W277</text>
  <polygon class="room" points="685,520 765,520 765,870 685,870 685,815 665,815 665,870 570,870 570,575 685,575"/><text class="lbl" x="672" y="708">W279</text>
  <polygon class="room" points="765,575 815,575 815,640 875,640 875,870 765,870"/><text class="lbl" x="817" y="738">281</text>
  <polygon class="room" points="380,520 380,575 355,575 355,870 270,870 270,815 165,815 165,700 270,700 270,520"/><text class="lbl" x="288" y="708">W275</text>
  <polygon class="room" points="440,440 520,440 520,460 490,485 490,520 460,520 460,575 380,575 380,485 440,485"/>
  <polygon class="room" points="1175,405 1250,405 1250,440 1420,440 1420,520 1380,485 1380,520 1320,520 1320,575 1270,575 1270,520 1250,520 1250,575 1175,575 1175,520 1105,520 1105,440 1175,440"/>
  <rect class="room" x="875" y="75" width="195" height="365"/><text class="lbl" x="973" y="258">W280</text>
  <rect class="room" x="1070" y="75" width="180" height="365"/>
  <rect class="room" x="460" y="250" width="355" height="65"/><text class="lblS" x="638" y="283">W278</text>
  <rect class="room" x="1465" y="250" width="165" height="105"/>
  <rect class="room" x="1820" y="250" width="115" height="155"/><text class="lbl" x="1878" y="328">W230</text>
  <rect class="room" x="875" y="520" width="195" height="350"/><text class="lbl" x="973" y="695">W283</text>
  <rect class="room" x="1070" y="520" width="180" height="350"/><text class="lbl" x="1160" y="695">W285</text>
  <rect class="room" x="1465" y="520" width="100" height="180"/><text class="lbl" x="1515" y="610">W296</text>
  <rect class="room" x="1565" y="520" width="100" height="180"/><text class="lbl" x="1615" y="610">W235</text>
  <rect class="room" x="1665" y="520" width="100" height="180"/>
  <rect class="room" x="125" y="575" width="40" height="65"/><text class="lblS" x="145" y="608">275A</text>
  <rect class="room" x="125" y="575" width="40" height="65"/><text class="lblS" x="145" y="608">R275A</text>

  <rect class="core" x="765" y="405" width="50" height="35"/>
  <g class="stair"><line x1="765" y1="414" x2="815" y2="414"/><line x1="765" y1="432" x2="815" y2="432"/></g>
  <rect class="core" x="1350" y="560" width="30" height="100"/>
  <g class="stair"><line x1="1359" y1="560" x2="1359" y2="660"/><line x1="1377" y1="560" x2="1377" y2="660"/></g>
  <polygon class="floor-edge" points="270,75 1380,75 1380,250 2000,250 2000,700 1465,700 1465,815 1380,815 1380,885 270,885 270,870 165,870 165,640 125,640 125,575 130,575 130,520 110,520 110,405 270,405"/>
  <line class="door" x1="270" y1="329" x2="270" y2="293"/><text class="exit" x="325" y="311">EXIT</text>
  <line class="door" x1="1501" y1="700" x2="1465" y2="700"/><text class="exit" x="1483" y="645">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(1789,75) rotate(11)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
