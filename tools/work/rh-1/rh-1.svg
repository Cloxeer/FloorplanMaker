<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2394 1416" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Rentfrow Hall (bldg 211) - FLOOR 1
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="455,250 1165,250 1165,55 1260,55 1260,5 2385,5 2385,760 1925,760 1925,1300 585,1300 585,1175 40,1175 40,770 285,770 285,575 455,575"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="455" y="605" width="260" height="165"/>
  <rect class="hall" x="715" y="635" width="340" height="135"/>
  <rect class="hall" x="1055" y="635" width="110" height="125"/>
  <rect class="hall" x="975" y="375" width="65" height="260"/>
  <rect class="hall" x="585" y="770" width="95" height="530"/>
  <rect class="hall" x="870" y="770" width="75" height="460"/>
  <rect class="hall" x="945" y="1180" width="100" height="120"/>
  <rect class="hall" x="1055" y="760" width="870" height="95"/>
  <rect class="hall" x="1055" y="855" width="82" height="45"/>
  <rect class="hall" x="1507" y="855" width="168" height="50"/>
  <rect class="hall" x="1865" y="855" width="60" height="30"/>
  <text class="hall-lbl" x="808" y="703">Hallway</text>
  <text class="hall-lbl" x="1448" y="808">Hallway</text>
  <text class="hall-lbl" transform="rotate(-90 633 953)" x="633" y="953">Hallway</text>

  <!-- ROOMS -->
  <rect class="room" x="455" y="250" width="120" height="350"/><text class="lbl" x="515" y="425">R129</text>
  <rect class="room" x="590" y="275" width="120" height="330"/><text class="lbl" x="650" y="440">R130</text>
  <rect class="room" x="715" y="250" width="245" height="375"/><text class="lbl" x="838" y="438">100</text>
  <rect class="room" x="975" y="255" width="180" height="115"/><text class="lbl" x="1065" y="313">M118</text>
  <rect class="room" x="1040" y="375" width="115" height="125"/><text class="lbl" x="1098" y="438">R102</text>
  <rect class="room" x="1040" y="505" width="115" height="120"/><text class="lbl" x="1098" y="565">R101</text>
  <rect class="room" x="1165" y="55" width="95" height="195"/><text class="lbl" x="1213" y="153">103C</text>
  <rect class="room" x="1165" y="250" width="95" height="380"/><text class="lbl" x="1213" y="440">103B</text>
  <polygon class="room" points="1260,5 1945,5 1945,760 1165,760 1165,630 1260,630"/><text class="lbl" x="1593" y="390">103A</text>
  <rect class="room" x="1945" y="5" width="440" height="755"/><text class="lbl" x="2165" y="383">103</text>
  <rect class="room" x="285" y="575" width="170" height="195"/><text class="lbl" x="370" y="673">128</text>
  <rect class="room" x="40" y="770" width="545" height="405"/><text class="lbl" x="313" y="973">127</text>
  <rect class="room" x="680" y="770" width="190" height="145"/><text class="lbl" x="775" y="843">105</text>
  <rect class="room" x="680" y="915" width="190" height="135"/><text class="lbl" x="775" y="983">107</text>
  <rect class="room" x="680" y="1050" width="190" height="130"/><text class="lbl" x="775" y="1115">109</text>
  <rect class="room" x="680" y="1180" width="190" height="120"/><text class="lbl" x="775" y="1240">110</text>
  <rect class="room" x="945" y="770" width="110" height="205"/><text class="lbl" x="1000" y="873">106</text>
  <rect class="room" x="945" y="975" width="110" height="205"/><text class="lbl" x="1000" y="1078">108</text>
  <rect class="room" x="870" y="1230" width="75" height="70"/><text class="lbl" x="908" y="1265">R110</text>
  <rect class="room" x="1050" y="1180" width="95" height="120"/><text class="lbl" x="1098" y="1240">T111</text>
  <polygon class="room" points="1055,900 1137,900 1137,855 1507,855 1507,905 1595,905 1595,1300 1145,1300 1145,1180 1055,1180"/><text class="lbl" x="1335" y="1077">114</text>
  <polygon class="room" points="1595,905 1675,905 1675,855 1865,855 1865,885 1925,885 1925,1175 1595,1175"/><text class="lbl" x="1763" y="1023">119</text>
  <rect class="room" x="1600" y="1180" width="160" height="120"/><text class="lbl" x="1680" y="1240">R115</text>
  <rect class="room" x="1760" y="1180" width="165" height="120"/><text class="lbl" x="1843" y="1240">M117</text>

  <rect class="core" x="1165" y="255" width="35" height="75"/>
  <g class="stair"><line x1="1165" y1="264" x2="1200" y2="264"/><line x1="1165" y1="282" x2="1200" y2="282"/><line x1="1165" y1="300" x2="1200" y2="300"/><line x1="1165" y1="318" x2="1200" y2="318"/></g>
  <polygon class="floor-edge" points="455,250 1165,250 1165,55 1260,55 1260,5 2385,5 2385,760 1925,760 1925,1300 585,1300 585,1175 40,1175 40,770 285,770 285,575 455,575"/>
  <line class="door" x1="285" y1="600" x2="285" y2="725"/><text class="exit" x="285" y="718">EXIT</text>
  <line class="door" x1="905" y1="250" x2="940" y2="250"/><text class="exit" x="922" y="232">EXIT</text>
  <line class="door" x1="1070" y1="250" x2="1105" y2="250"/><text class="exit" x="1088" y="232">EXIT</text>
  <line class="door" x1="600" y1="1300" x2="675" y2="1300"/><text class="exit" x="638" y="1355">EXIT</text>
  <line class="door" x1="965" y1="1300" x2="1040" y2="1300"/><text class="exit" x="1003" y="1355">EXIT</text>
  <line class="door" x1="1925" y1="775" x2="1925" y2="850"/><text class="exit" x="1870" y="812">EXIT</text>
  <line class="door" x1="2385" y1="690" x2="2385" y2="755"/><text class="exit" x="2335" y="722">EXIT</text>
  <line class="door" x1="2385" y1="15" x2="2385" y2="55"/><text class="exit" x="2335" y="35">EXIT</text>
  <!-- Which way the building really faces; matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(2310,1248) rotate(14)">
    <circle r="80" fill="#ffffff" stroke="#1d1f23" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
