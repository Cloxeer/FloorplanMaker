<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1636 644" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    Chemistry Building (bldg 187) - FLOOR 1
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .void  { fill: #f7f7f8; stroke: #b5bac0; stroke-width: 2; stroke-dasharray: 10 8; }
    .dim   { fill: #8a8f96; text-anchor: middle; dominant-baseline: middle; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .hall  { fill: #d7dbe0; stroke: none; }
    .hall-lbl { fill: #6b7280; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .authwall { stroke: #7c3aed; stroke-width: 6; stroke-dasharray: 10 8; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
    .floor-edge { fill:none; stroke:#3a3d42; stroke-width:6; stroke-linejoin:round; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="285,55 1370,55 1370,80 1405,80 1405,165 1370,165 1370,450 1515,450 1515,455 1595,455 1595,565 1525,565 1525,560 1475,560 1475,615 1420,615 1420,595 105,595 105,485 175,485 175,495 105,495 105,200 285,200"/>

  <!-- HALLWAYS -->
  <rect class="hall" x="645" y="360" width="725" height="90"/>
  <rect class="hall" x="645" y="55" width="30" height="305"/>
  <rect class="hall" x="285" y="360" width="270" height="90"/>
  <rect class="hall" x="555" y="360" width="90" height="90"/>
  <text class="hall-lbl" x="828" y="403">Hallway</text>
  <text class="hall-lbl" x="498" y="403">Hallway</text>
  <text class="hall-lbl" x="1158" y="403">Hallway</text>

  <!-- ROOMS -->
  <polygon class="room" points="105,200 285,200 285,360 175,360 175,330 105,330"/><text class="lbl" x="199" y="275">134</text>
  <polygon class="room" points="1475,450 1515,450 1515,495 1475,495 1475,485 1405,485 1405,495 1370,495 1370,485 1420,485"/>
  <polygon class="room" points="920,450 1000,450 1000,595 920,595"/><text class="lbl" x="960" y="523">143</text>
  <polygon class="room" points="725,450 725,595 645,595 645,450"/><text class="lbl" x="685" y="523">141</text>
  <polygon class="room" points="815,450 905,450 905,595 815,595"/><text class="lbl" x="860" y="523">R142</text>
  <polygon class="room" points="800,55 815,80 815,55 1000,55 1000,360 920,360 920,330 815,330 815,360 760,360 725,255 700,255 675,200 675,80 725,80 725,55"/><text class="lbl" x="850" y="196">130</text>
  <rect class="room" x="285" y="55" width="180" height="305"/><text class="lbl" x="375" y="208">133</text>
  <rect class="room" x="465" y="55" width="180" height="305"/><text class="lbl" x="555" y="208">132</text>
  <rect class="room" x="1000" y="55" width="135" height="145"/><text class="lbl" x="1068" y="128">128</text>
  <rect class="room" x="1135" y="55" width="235" height="145"/><text class="lbl" x="1253" y="128">127</text>
  <rect class="room" x="1000" y="200" width="90" height="160"/><text class="lbl" x="1045" y="280">129</text>
  <rect class="room" x="1090" y="200" width="180" height="160"/><text class="lbl" x="1180" y="280">125</text>
  <rect class="room" x="1270" y="200" width="100" height="160"/><text class="lbl" x="1320" y="280">126</text>
  <rect class="room" x="285" y="450" width="90" height="145"/><text class="lbl" x="330" y="523">137</text>
  <rect class="room" x="375" y="450" width="180" height="145"/><text class="lbl" x="465" y="523">138</text>
  <rect class="room" x="555" y="450" width="90" height="145"/><text class="lbl" x="600" y="523">140</text>
  <rect class="room" x="725" y="450" width="90" height="145"/>
  <rect class="room" x="1000" y="450" width="90" height="145"/><text class="lbl" x="1045" y="523">144</text>
  <rect class="room" x="1525" y="455" width="70" height="110"/>

  <rect class="core" x="175" y="495" width="70" height="100"/>
  <g class="stair"><line x1="184" y1="495" x2="184" y2="595"/><line x1="202" y1="495" x2="202" y2="595"/><line x1="220" y1="495" x2="220" y2="595"/><line x1="238" y1="495" x2="238" y2="595"/></g>
  <rect class="core" x="1420" y="560" width="55" height="55"/>
  <g class="stair"><line x1="1429" y1="560" x2="1429" y2="615"/><line x1="1447" y1="560" x2="1447" y2="615"/><line x1="1465" y1="560" x2="1465" y2="615"/></g>
  <polygon class="floor-edge" points="285,55 1370,55 1370,80 1405,80 1405,165 1370,165 1370,450 1515,450 1515,455 1595,455 1595,565 1525,565 1525,560 1475,560 1475,615 1420,615 1420,595 105,595 105,485 175,485 175,495 105,495 105,200 285,200"/>
  <line class="door" x1="1370" y1="80" x2="1405" y2="80"/><text class="exit" x="1388" y="135">EXIT</text>
  <line class="door" x1="105" y1="430" x2="105" y2="394"/><text class="exit" x="160" y="412">EXIT</text>
</svg>
