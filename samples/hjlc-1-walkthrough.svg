<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 1800" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <!--
    HJLC (bldg 323) - FLOOR 1
    Traced from the posted "Emergency Evacuation Plan" photo. Coordinates use the
    photo's own pixel positions, so any shape can be checked against the photo.
    One wall weight for outside walls, one for inside walls; nothing in between.
  -->
  <style>
    .floor { fill: #ffffff; stroke: #3a3d42; stroke-width: 6; stroke-linejoin: round; }
    .room  { fill: #eef1f4; stroke: #8f959c; stroke-width: 2; }
    .big   { fill: #e6ecf5; stroke: #8f959c; stroke-width: 2; }
    .ours  { fill: #f5e3ea; stroke: #8f959c; stroke-width: 2; }
    .core  { fill: #dfe3e8; stroke: #8f959c; stroke-width: 2; }
    .stair { stroke: #8f959c; stroke-width: 2; }
    .door  { stroke: #ffffff; stroke-width: 10; }
    .lbl   { fill: #2b2e33; font-size: 24px; text-anchor: middle; dominant-baseline: middle; }
    .lblS  { fill: #2b2e33; font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
    .name  { fill: #1d1f23; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .exit  { fill: #1a7f37; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .compass-letter { font-size: 22px; font-weight: 600; fill: #8a8690; text-anchor: middle; }
    .compass-north  { fill: #8C0B42; }
  </style>

  <!-- OUTSIDE WALLS -->
  <polygon class="floor" points="-215,160 1615,160 1615,1680 -215,1680"/>

  <!-- ROOMS -->
  <rect class="room" x="352" y="6" width="446" height="276"/><text class="lbl" x="575" y="144">128R</text>
  <rect class="room" x="804" y="46" width="59" height="78"/><text class="lblS" x="834" y="85">101</text>
  <rect class="room" x="914" y="69" width="86" height="51"/>
  <rect class="room" x="983" y="124" width="59" height="57"/><text class="lblS" x="1013" y="153">R131</text>
  <rect class="room" x="804" y="129" width="48" height="74"/>
  <rect class="room" x="194" y="134" width="99" height="77"/><text class="lbl" x="244" y="173">128A</text>
  <rect class="room" x="601" y="181" width="69" height="100"/>
  <rect class="room" x="978" y="186" width="63" height="93"/>
  <rect class="room" x="804" y="209" width="58" height="72"/><text class="lblS" x="833" y="245">128P</text>
  <rect class="room" x="203" y="222" width="91" height="49"/>
  <rect class="room" x="439" y="408" width="457" height="396"/><text class="lbl" x="668" y="606">125</text>
  <rect class="room" x="370" y="409" width="100" height="163"/>
  <rect class="room" x="391" y="581" width="43" height="61"/>
  <rect class="room" x="905" y="806" width="103" height="102"/>
  <rect class="room" x="960" y="950" width="63" height="117"/>
  <rect class="room" x="1039" y="1153" width="60" height="60"/><text class="lblS" x="1069" y="1183">105A</text>
  <rect class="room" x="956" y="1154" width="77" height="100"/>
  <rect class="room" x="560" y="1159" width="115" height="163"/>
  <rect class="room" x="471" y="1161" width="83" height="170"/>
  <rect class="room" x="834" y="1161" width="60" height="58"/>
  <rect class="room" x="750" y="1162" width="79" height="165"/><text class="lbl" x="790" y="1245">S115</text>
  <rect class="room" x="683" y="1163" width="61" height="165"/><text class="lblS" x="714" y="1246">S117</text>
  <rect class="room" x="835" y="1226" width="59" height="59"/>
  <rect class="room" x="1028" y="1372" width="65" height="104"/>
  <rect class="room" x="960" y="1375" width="57" height="101"/>
  <rect class="room" x="898" y="1376" width="55" height="54"/>
  <rect class="room" x="757" y="1378" width="41" height="104"/>
  <rect class="room" x="683" y="1379" width="67" height="103"/><text class="lblS" x="717" y="1431">S116</text>
  <rect class="room" x="541" y="1380" width="136" height="108"/>
  <rect class="room" x="481" y="1382" width="54" height="107"/>
  <rect class="room" x="803" y="1384" width="42" height="79"/>

  <line class="door" x1="-215" y1="633" x2="-215" y2="597"/><text class="exit" x="-160" y="615">EXIT</text>
  <line class="door" x1="-215" y1="1243" x2="-215" y2="1207"/><text class="exit" x="-160" y="1225">EXIT</text>
  <!-- Which way the building really faces. The angle comes from NMSU Space Planning's outline of the
       building, and matches the compass on the posted evacuation map. -->
  <g class="compass" transform="translate(1495,220) rotate(15)">
    <circle r="62" fill="#ffffff" stroke="#e6e6ea" stroke-width="3"/>
    <circle r="49" fill="none" stroke="#f0f0f3" stroke-width="2"/>
    <path d="M0,-38 L11,0 L-11,0 Z" fill="#8C0B42"/>
    <path d="M0,38 L11,0 L-11,0 Z" fill="#c7c7cc"/>
    <circle r="4.5" fill="#ffffff" stroke="#8a8690" stroke-width="2"/>
    <text class="compass-letter compass-north" x="0" y="-52">N</text>
    <text class="compass-letter" x="0" y="62">S</text>
    <text class="compass-letter" x="57" y="6">E</text>
    <text class="compass-letter" x="-57" y="6">W</text>
  </g>
</svg>
